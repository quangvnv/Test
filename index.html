u từ log hệ thống, công cụ nào dùng để lọc nhanh sự kiện?",[2],["Photoshop","excel","grep, awk, tail","powerpoint"]],["Khi xử lý tậo dữ liệu (Big Data) công cụ nào sử dụng?",[0],["Hadoop, Spark","MS Paint","Notepad","WinRAR"]],["Khi gặp tình trạng quá tải thông tin, cách xử lý hiệu quả?",[3],["Lưu tất cả thông tin để sau này đọc","Bỏ qua thông tin","Lưu thông tin sang một bên khác","Lọc theo nhu cầu bằng công cụ (Evernote, Notion, Zote)"]],["Trên trình duyệt, nút “Forward” được dùng để:",[3],["Quay về trang trước đó","Làm mới trang hiện tại","Đóng cửa sổ trình duyệt","Đi tới trang kế tiếp sau khi nhấn Back"]],["Khi gõ từ khóa sai chính tả, Google thường:",[1],["Không trả kết quả nào","Tự động gợi ý từ đúng","Hiện lỗi “404 not found”","Chặn truy cập"]],["Đồng chí nhận được một email tuyên bố Đồng chí trúng thưởng từ một tổ chức. Hành động nào giúp xác minh tính xác thực của email?",[3],["Nhấp vào liên kết trong email để kiểm tra.","Chuyển tiếp email đến Đồng chí bè để hỏi ý kiến.","Gọi ngay số điện thoại trong email để xác nhận.","Kiểm tra địa chỉ email gửi có khớp với tên miền chính thức của tổ chức."]],["Để xác minh một bài báo trên mạng, Đồng chí nên làm gì?",[2],["Chỉ đọc tiêu đề và rút ra kết luận.","Tìm kiếm bài báo trên mạng xã hội.","So sánh thông tin với các nguồn đáng tin cậy khác.","Tin tưởng ngay nếu bài báo có nhiều lượt chia sẻ."]],["Đồng chí muốn xác minh một trang web có đáng tin cậy không. Hành động nào sau đây là phù hợp nhất?",[3],["Chỉ dựa vào số lượt truy cập của trang web.","Đọc các bình luận của người dùng trên trang web.","Xem trang web có thiết kế đẹp hay không.","Kiểm tra thông tin liên hệ và chính sách bảo mật của trang web."]],["Làm thế nào để kiểm tra xem một tổ chức trực tuyến có hợp pháp?",[1],["Gửi email trực tiếp đến tổ chức để hỏi.","Tìm kiếm thông tin tổ chức trên các cơ quan quản lý chính thức.","Kiểm tra xem tổ chức có nhiều người theo dõi trên mạng xã hội không.","Đọc các bài đánh giá trên trang web của tổ chức."]],["Khi kiểm tra một bài viết khoa học, Đồng chí nên làm gì để đảm bảo tính xác thực?",[2],["Đọc các bình luận của độc giả về bài viết.","Tin tưởng nếu bài viết được viết bởi một giáo sư.","Kiểm tra xem bài viết có được công bố trên tạp chí khoa học uy tín không.","Chỉ cần bài viết có nhiều lượt chia sẻ là đủ."]],["Đồng chí nhận được một tin nhắn từ ngân hàng yêu cầu cung cấp thông tin cá nhân. Hành động nào sau đây là đúng?",[0],["Gọi đến số hotline chính thức của ngân hàng để xác minh.","Nhấp vào liên kết trong tin nhắn để kiểm tra.","Cung cấp thông tin ngay để tránh rắc rối.","Chuyển tin nhắn cho Đồng chí bè để hỏi ý kiến."]],["Làm thế nào để kiểm tra xem một hình ảnh trên mạng có bị chỉnh sửa?",[1],["Hỏi ý kiến Đồng chí bè về tính xác thực của hình ảnh.","Sử dụng công cụ như Google Reverse Image Search hoặc TinEye.","Kiểm tra số lượt thích của hình ảnh.","Xem hình ảnh có được đăng bởi tài khoản nổi tiếng không."]],["Khi đọc một bài viết trực tuyến, Đồng chí nhận thấy số liệu thống kê không rõ nguồn gốc. Đồng chí nên làm gì?",[3],["Chấp nhận số liệu nếu nó phù hợp với quan điểm của Đồng chí.","Bỏ qua số liệu và chỉ đọc nội dung chính.","Tin tưởng nếu bài viết được đăng trên trang web nổi tiếng.","Tìm kiếm số liệu đó trên các nguồn dữ liệu đáng tin cậy như WHO hoặc World Bank."]],["Đồng chí thấy một bài viết tuyên bố về một phương pháp chữa bệnh mới. Hành động nào giúp xác minh?",[0],["Kiểm tra xem phương pháp có được công nhận bởi cơ quan y tế không.","Đọc các bình luận của người dùng về phương pháp đó.","Tin tưởng nếu bài viết có hình ảnh minh họa đẹp.","Tìm kiếm trên mạng xã hội để xem mức độ phổ biến."]],["Làm thế nào để kiểm tra xem một câu trích dẫn nổi tiếng có chính xác?",[2],["Hỏi ý kiến Đồng chí bè về câu trích dẫn.","Tin tưởng nếu câu trích dẫn được chia sẻ rộng rãi.","Tra cứu câu trích dẫn trên các nguồn đáng tin cậy như sách hoặc bài báo.","Kiểm tra xem câu trích dẫn có được đăng bởi người nổi tiếng không."]],["Đồng chí nhận được một thông báo về cập nhật phần mềm khẩn cấp. Hành động nào là an toàn nhất?",[1],["Chuyển thông báo cho Đồng chí bè để xác minh.","Kiểm tra thông báo trên trang web chính thức của nhà cung cấp phần mềm.","Cài đặt phần mềm từ nguồn thứ ba để tiết kiệm thời gian.","Nhấp vào liên kết trong thông báo để tải ngay."]],["Để kiểm tra một bài viết về lịch sử, Đồng chí nên làm gì?",[1],["Tin tưởng nếu bài viết có nhiều hình ảnh minh họa.","Đối chiếu thông tin với các tài liệu lịch sử đáng tin cậy.","Kiểm tra xem bài viết có được viết bởi chuyên gia không.","Dựa vào số lượt chia sẻ của bài viết."]],["Đồng chí thấy một bài đăng tuyên bố về một sự kiện sắp diễn ra. Hành động nào giúp xác minh?",[2],["Tin tưởng nếu bài đăng có nhiều lượt thích.","Hỏi ý kiến người đăng bài.","Kiểm tra thông tin trên trang web chính thức của sự kiện.","Chia sẻ bài đăng để kiểm tra phản hồi."]],["Làm thế nào để kiểm tra tính xác thực của một báo cáo tài chính trực tuyến?",[3],["Hỏi ý kiến Đồng chí bè về báo cáo.","Tin tưởng nếu báo cáo có thiết kế chuyên nghiệp.","Dựa vào số lượt xem của báo cáo.","So sánh với báo cáo từ các cơ quan tài chính uy tín."]],["Khi nhận được một liên kết tải ứng dụng, Đồng chí nên làm gì để đảm bảo an toàn?",[1],["Tải ngay nếu liên kết được gửi từ Đồng chí bè.","Chỉ tải từ các cửa hàng ứng dụng chính thức như Google Play hoặc App Store.","Tin tưởng nếu liên kết có thiết kế đẹp.","Kiểm tra số lượt tải của ứng dụng qua liên kết."]],["Đồng chí muốn xác minh một bài viết về công nghệ mới. Hành động nào là phù hợp nhất?",[3],["Hỏi ý kiến người đăng bài viết.","Chỉ đọc tiêu đề để đánh giá.","Tin tưởng nếu bài viết có nhiều lượt chia sẻ.","Tìm kiếm thông tin trên các tạp chí công nghệ uy tín như TechCrunch."]],["Làm thế nào để xử lý một email lừa đảo yêu cầu thông tin cá nhân?",[1],["Trả lời email để yêu cầu thêm thông tin.","Báo cáo email cho nhà cung cấp dịch vụ email.","Chuyển email cho Đồng chí bè để cảnh báo.","Nhấp vào liên kết trong email để kiểm tra."]],["Khi thấy một tin đồn lan truyền trên mạng xã hội, Đồng chí nên làm gì?",[2],["Chia sẻ ngay để mọi người biết.","Tin tưởng nếu tin đồn được nhiều người nhắc đến.","Kiểm tra thông tin trên các nguồn tin cậy trước khi chia sẻ.","Hỏi ý kiến Đồng chí bè về tin đồn."]],["Đồng chí nhận được một tin nhắn từ một số lạ yêu cầu gửi tiền. Hành động nào là đúng?",[3],["Gửi tiền ngay nếu tin nhắn có vẻ khẩn cấp.","Chuyển tin nhắn cho Đồng chí bè để hỏi ý kiến.","Tin tưởng nếu số điện thoại có mã vùng quen thuộc.","Xác minh danh tính người gửi qua kênh liên lạc chính thức."]],["Làm thế nào để xác định một bài viết chứa thông tin sai về sức khỏe?",[3],["Chia sẻ bài viết để cảnh báo người khác.","Tin tưởng nếu bài viết được viết bởi bác sĩ.","Hỏi ý kiến Đồng chí bè về bài viết.","Đối chiếu thông tin với các nguồn y tế đáng tin cậy như WHO."]],["Khi phát hiện một video giả mạo (deepfake), Đồng chí nên làm gì?",[1],["Tin tưởng nếu video có chất lượng cao.","Sử dụng công cụ phân tích video như Deepware Scanner.","Chia sẻ video để cảnh báo người khác.","Hỏi ý kiến Đồng chí bè về video."]],["Đồng chí thấy một bài viết có thông tin sai lệch về chính trị. Hành động nào là phù hợp?",[2],["Tin tưởng nếu bài viết phù hợp với quan điểm của Đồng chí.","Chia sẻ bài viết để thảo luận.","Kiểm tra thông tin trên các nguồn tin tức uy tín.","Bình luận phản bác ngay dưới bài viết."]],["Làm thế nào để xử lý một trang web giả mạo ngân hàng?",[3],["Nhập thông tin cá nhân để kiểm tra.","Chuyển liên kết trang web cho Đồng chí bè.","Tin tưởng nếu trang web có thiết kế giống ngân hàng.","Báo cáo trang web cho cơ quan quản lý và ngân hàng liên quan."]],["Khi nhận được một tin nhắn lừa đảo qua mạng xã hội, Đồng chí nên làm gì?",[1],["Trả lời tin nhắn để hỏi thêm thông tin.","Báo cáo tin nhắn cho nền tảng và chặn tài khoản gửi.","Chuyển tin nhắn cho Đồng chí bè để cảnh báo.","Nhấp vào liên kết trong tin nhắn để kiểm tra."]],["Để kiểm tra tính xác thực của một hình ảnh, Đồng chí có thể sử dụng công cụ nào?",[0],["Google Reverse Image Search.","Microsoft Word.","Notepad.","Paint."]],["Để kiểm tra một video có bị chỉnh sửa, Đồng chí nên sử dụng công cụ nào?",[2],["Windows Media Player.","VLC Media Player.","InVID hoặc Forensically.","Adobe Premiere."]],["Làm thế nào để xác minh một tên miền có đáng tin cậy?",[3],["Kiểm tra số lượt truy cập của tên miền.","Hỏi ý kiến Đồng chí bè về tên miền.","Tin tưởng nếu tên miền có thiết kế đẹp.","Sử dụng WHOIS để tra cứu thông tin đăng ký tên miền."]],["Đồng chí muốn xác minh một số liệu thống kê về kinh tế. Nguồn nào là đáng tin cậy nhất?",[1],["Blog cá nhân về kinh tế.","World Bank hoặc IMF.","Bài viết trên mạng xã hội.","Bình luận của người dùng."]],["Làm thế nào để xác minh một tài khoản mạng xã hội có thật?",[2],["Tin tưởng nếu tài khoản có nhiều người theo dõi.","Hỏi ý kiến Đồng chí bè về tài khoản.","Kiểm tra dấu tích xác minh hoặc thông tin liên hệ chính thức.","Dựa vào số bài đăng của tài khoản."]],["Đồng chí muốn kiểm tra một bài viết về y học. Nguồn nào là đáng tin cậy nhất?",[3],["Blog cá nhân về y học.","Bài đăng trên mạng xã hội.","Bình luận của người dùng.","Các nghiên cứu trên PubMed hoặc WHO."]],["Để kiểm tra một liên kết có an toàn hay không, Đồng chí nên sử dụng công cụ nào?",[1],["Microsoft Word.","VirusTotal hoặc Google Safe Browsing.","Notepad.","Paint."]],["Đồng chí nhận được một tin nhắn từ \"ngân hàng\" yêu cầu cập nhật thông tin. Hành động nào là đúng?",[0],["Truy cập trực tiếp trang web chính thức của ngân hàng để kiểm tra.","Nhấp vào liên kết trong tin nhắn.","Gửi thông tin cá nhân qua tin nhắn.","Chuyển tin nhắn cho Đồng chí bè."]],["Đồng chí nhận được một email yêu cầu xác minh tài khoản. Hành động nào là an toàn nhất?",[2],["Nhấp vào liên kết trong email.","Gửi thông tin cá nhân qua email.","Truy cập trang web chính thức của dịch vụ để kiểm tra.","Chuyển email cho Đồng chí bè."]],["Đồng chí thấy một bài đăng về một chương trình khuyến mãi. Hành động nào giúp xác minh?",[0],["Kiểm tra thông tin trên trang web chính thức của công ty.","Tin tưởng nếu bài đăng có nhiều lượt thích.","Hỏi ý kiến người đăng bài.","Tham gia chương trình ngay để không bỏ lỡ."]],["Khi thấy một bài viết về một vụ việc pháp lý, Đồng chí nên làm gì?",[1],["Tin tưởng nếu bài viết có nhiều lượt chia sẻ.","Kiểm tra thông tin từ các nguồn tin tức pháp lý uy tín.","Hỏi ý kiến Đồng chí bè về bài viết.","Dựa vào tiêu đề của bài viết."]],["Đồng chí thấy một bài đăng về một cuộc thi trực tuyến. Hành động nào giúp xác minh?",[3],["Tin tưởng nếu bài đăng có nhiều lượt thích.","Hỏi ý kiến người đăng bài.","Tham gia cuộc thi ngay để không bỏ lỡ.","Kiểm tra thông tin trên trang web chính thức của ban tổ chức."]],["Khi nhận được một thông báo về thuế, Đồng chí nên làm gì để xác minh?",[1],["Nhấp vào liên kết trong thông báo.","Kiểm tra thông tin trên trang web chính thức của cơ quan thuế.","Gửi thông tin cá nhân qua email.","Chuyển thông báo cho Đồng chí bè."]],["Khi thấy một bài viết có nhiều nguồn trích dẫn, Đồng chí nên làm gì?",[1],["Tin tưởng nếu bài viết có nhiều nguồn.","Kiểm tra từng nguồn trích dẫn để đảm bảo tính chính xác.","Hỏi ý kiến Đồng chí bè về bài viết.","Dựa vào số lượt chia sẻ của bài viết."]],["Để kiểm tra một bài viết về trí tuệ nhân tạo, Đồng chí nên làm gì?",[2],["Tin tưởng nếu bài viết có nhiều thuật ngữ kỹ thuật.","Hỏi ý kiến Đồng chí bè về bài viết.","Đối chiếu thông tin với các tạp chí công nghệ hoặc nghiên cứu AI.","Dựa vào số lượt chia sẻ của bài viết."]],["Đồng chí nhận được một thông báo về một giao dịch tài chính. Hành động nào là an toàn nhất?",[3],["Nhấp vào liên kết trong thông báo.","Gửi thông tin cá nhân qua tin nhắn.","Chuyển thông báo cho Đồng chí bè.","Kiểm tra giao dịch trên ứng dụng hoặc trang web chính thức của ngân hàng."]],["Để kiểm tra một bài viết về chính sách công, Đồng chí nên làm gì?",[1],["Tin tưởng nếu bài viết có nhiều lượt chia sẻ.","Kiểm tra thông tin từ các cơ quan chính phủ hoặc tổ chức quốc tế.","Hỏi ý kiến Đồng chí bè về bài viết.","Dựa vào tiêu đề của bài viết."]],["Đồng chí muốn kiểm tra ngày giờ chụp một bức ảnh từ dữ liệu EXIF, Đồng chí cần làm gì?",[1],["Mở ảnh và quan sát kỹ góc dưới để xem có hiển thị ngày giờ không.","Xem thông tin EXIF của ảnh bằng cách nhấp chuột phải → Properties/Details (trên Windows) hoặc Get Info (trên Mac).","Mở ảnh trong trình duyệt web và kéo xuống cuối trang.","Đăng ảnh lên Facebook để hệ thống tự hiển thị ngày chụp."]],["Nếu muốn kiểm chứng thời gian (chronolocation), Đồng chí có thể:",[0],["Dùng SunCalc để so ánh nắng, bóng đổ","Đếm số người trong ảnh","Xem số like","Đo kích thước file"]],["Fact Check Explorer của Google dùng để:",[1],["Tìm video hot nhất tuần","Kiểm tra tin tức đã được fact-check chưa","Đếm số trang web tin giả","Chỉnh sửa ảnh"]],["Nếu Đồng chí gặp biểu đồ số liệu nhưng không có nguồn rõ ràng, Đồng chí nên:",[2],["Tin vì nhìn đẹp","Hỏi tác giả bài đăng","Tìm tập dữ liệu gốc hoặc DOI/nguồn sơ cấp","Đo màu đường kẻ"]],["Khi nghi ngờ một video có thể là deepfake,Đồng chí nên làm gì?",[1],["Chia sẻ để mọi người tự đánh giá","Dùng công cụ phân tích forensics hoặc tìm nguồn gốc video","Tải về lưu làm kỷ niệm","Xem lượt comment để quyết định"]],["Metadata của file PDF có thể sử dụng để kiểm tra những thông tin gì ?",[0],["Ngày tạo, phần mềm dùng để tạo, tác giả","Dung lượng RAM máy tính","Mật khẩu tài khoản Gmail","Vị trí máy in"]],["Nếu muốn so sánh thông tin từ nhiều nguồn, Đồng chí nên chọn nguồn thế nào?",[1],["Càng nhiều càng tốt, không cần uy tín","Ít nhất 2 nguồn độc lập, có chuyên môn và minh bạch","Các trang blog cá nhân","Các group Facebook đông thành viên"]],["Khi nghi ngờ ảnh đã chỉnh sửa, Đồng chí có thể:",[0],["Dùng công cụ phân tích lỗi JPEG (JPEGsnoop, FotoForensics)","Dùng Paint để mở","Nhìn màu sắc xem có đẹp không","In ra giấy để xem"]],["Sau khi kiểm chứng thông tin, bước cuối cùng quan trọng nhất là gì?",[0],["Ghi lại kết quả, mức độ tin cậy và lý do","Xóa tất cả để khỏi phiền","Chỉ giữ trong đầu, không cần ghi chú","Chia sẻ cho vui"]],["Nếu Đồng chí muốn dùng Google Lens để tìm ngược một bức ảnh đã có sẵn trong điện thoại, Đồng chí không cần thực hiện bước nào?",[1],["Mở ứng dụng Google Lens (hoặc ứng dụng Google trên iPhone).","Hướng camera vào đối tượng và chụp ảnh trực tiếp.","Chọn biểu tượng thư viện trong Lens và chọn ảnh từ điện thoại.","Google Lens sẽ hiển thị kết quả tìm kiếm liên quan đến ảnh."]],["Trên máy tính, làm thế nào để tìm ngược một hình ảnh bằng Google Lens thông qua trang Google Hình ảnh? (1) Vào Google Drive và tải ảnh lên.; (2) Truy cập images.google.com; (3) Nhấp vào biểu tượng máy ảnh (Google Lens) ở thanh tìm kiếm. (4) Tải ảnh từ máy tính hoặc dán URL hình ảnh. (5) Google Lens sẽ phân tích ảnh và hiển thị kết quả.",[0],["(2), (3), (4), (5)","(1), (3), (4), (5)","(2), (1), (4), (5)","(2), (3), (4), (1)"]],["Khi càn kiểm chứng hình ảnh và phải tra cứu bằng Google Lens trên di động. Đồng chí cần làm gì? (1) Nhấn nút Home để về màn hình chính. (2) Chạm và giữ vào hình ảnh đó. (3). Chọn “Tìm kiếm bằng Google Lens” hoặc “Tìm kiếm hình ảnh này trên Google”. (4) Ứng dụng sẽ mở Google Lens và hiển thị kết quả. (5). Copy link ảnh rồi dán vào Facebook.",[1],["(3), (4), (5)","(2), (3), (4)","(1), (3), (4)","(4), (5)"]],["Khi Đồng chí thấy một video nghi ngờ là deepfake, Đồng chí nên làm gì để xác minh? (1). Xem kỹ chi tiết khuôn mặt, cử động môi, giọng nói có khớp tự nhiên không; (2) Tìm nguồn gốc gốc của video bằng cách tra ngược hình ảnh từ các khung hình trong video; (3) Tin ngay lập tức vì video thường không thể giả mạo; (4) Kiểm tra xem video có được đăng tải bởi nguồn tin cậy (báo chí chính thống, tài khoản xác thực); (5) So sánh với các bản tin, video chính thống khác về cùng sự kiện.",[1],["(1), (2), (3), (5)","(1), (2), (4), (5)","(1), (3), (4), (5)","(2), (3), (4), (5)"]],["Nếu Đồng chí thấy một tin tức gây tranh cãi và muốn kiểm chứng bằng Google Fact Check Explorer, bước đầu tiên Đồng chí cần làm là gì?",[1],["Chia sẻ ngay tin tức để hỏi ý kiến cộng đồng mạng.","Mở trình duyệt và truy cập Google Fact Check Explorer.","Sao chép tin đó và đăng lên Facebook.","Đoán tính chính xác dựa vào cảm giác cá nhân."]],["Sau khi mở Google Fact Check Explorer, Đồng chí cần thực hiện bước nào để bắt đầu kiểm tra một tin giả nghi ngờ?",[0],["Nhập từ khóa, cụm từ hoặc trích dẫn vào khung tìm kiếm rồi nhấn Enter.","Lướt xem các tin nổi bật trong Explorer mà không nhập gì.","Đóng tab trình duyệt và thử tìm bằng Google Hình ảnh.","Đăng nhập tài khoản Google mới có thể sử dụng."]],["Khi Google Fact Check Explorer trả về kết quả, Đồng chí nên làm gì để hiểu rõ hơn về tính xác thực của tin?",[1],["Chỉ nhìn vào chữ “True” hoặc “False” và bỏ qua chi tiết.","Nhấp vào liên kết nguồn để đọc toàn bộ bài viết và tìm hiểu thêm.","Tin vào kết quả đầu tiên mà không cần kiểm chứng thêm.","Đóng trang và tìm tin khác trên mạng xã hội."]],["Đồng chí muốn kiểm chứng một bức ảnh chụp ngoài đường (ví dụ một biển quảng cáo, một tòa nhà), Google Street View có thể giúp như thế nào?",[0],["So sánh vị trí và cảnh vật thực tế trong Street View với bức ảnh cần kiểm chứng.","Tự chỉnh sửa ảnh bằng Photoshop để giống trong Street View.","Dùng Street View để đoán cảm giác về nơi đó.","Street View không thể giúp gì trong trường hợp này."]],["Khi Đồng chí lưu một tệp tin mới trên máy tính, cách đặt tên nào sau đây là tốt nhất để dễ dàng tìm kiếm sau này?",[0],["2025-09-03_Bao-cao-du-an-A.docx","Bao_cao_du_an_A.docx","baocaoduanA.docx","BCDA.docx"]],["Để tránh lỗi khi chia sẻ tệp tin qua các hệ điều hành khác nhau, Đồng chí nên làm gì khi đặt tên tệp?",[3],["Chỉ sử dụng chữ cái in hoa","Chỉ sử dụng số","Sử dụng các ký tự đặc biệt như / hoặc *","Sử dụng chữ không dấu và thay khoảng trắng bằng dấu gạch dưới _"]],["Đồng chí muốn tìm tất cả các tệp tin hình ảnh trên máy tính. Đồng chí nên sử dụng cú pháp tìm kiếm nào trong File Explorer trên hệ điều hành Windows?",[0],["kind:picture","type:picture","format:jpg","filetype:image"]],["Để tìm kiếm tất cả các file PDF trên máy tính một cách nhanh chóng, Đồng chí nên sử dụng cú pháp nào?",[1],["kind:pdf","*.pdf","type:document","pdf-files"]],["Đồng chí muốn tìm một tệp tin đã được chỉnh sửa vào ngày hôm qua. Đồng chí nên sử dụng cú pháp tìm kiếm nào trong File Explorer trên hệ điều hành Windows?",[3],["modified:yesterday","date:yesterday","lastedited:24h","datemodified:yesterday"]],["Khi Đồng chí chia sẻ một tài liệu trên Google Drive và muốn người khác chỉ có thể đọc mà không được chỉnh sửa, Đồng chí nên chọn quyền truy cập nào?",[0],["Người xem","Người nhận xét","Người chỉnh sửa","Bị giới hạn"]],["Để chia sẻ một tệp trên Google Drive cho một nhóm người cụ thể, Đồng chí cần làm gì đầu tiên?",[2],["Gửi tệp đó qua email","Tải tệp lên một trang web","Nhập địa chỉ email của những người Đồng chí muốn chia sẻ","Tạo một bản sao mới của tệp"]],["Nếu Đồng chí muốn chia sẻ một thư mục với bất kỳ ai mà không cần đăng nhập, Đồng chí cần chọn chế độ chia sẻ nào trên Google Drive?",[3],["Bị giới hạn","Chỉ những người trong tổ chức","Chỉ những người có tài khoản Google","Bất kỳ ai có đường liên kết"]],["Khi Đồng chí muốn chọn nhiều tệp tin liền kề nhau trong một thư mục để chia sẻ, Đồng chí nên giữ phím nào trên bàn phím trong khi chọn?",[2],["Ctrl","Alt","Shift","Tab"]],["Đồng chí nên làm gì để phân loại các tệp tin có cùng chủ đề trong một thư mục lớn?",[2],["Đặt màu riêng cho từng loại tệp tin","Sử dụng chức năng ẩn tệp","Tạo các thư mục con và di chuyển các tệp vào đó","Đặt tên tệp thật dài"]],["Trong môi trường đám mây, Đồng chí khôi phục hệ thống sau sự cố bằng cách nào nhờ việc sao lưu dữ liệu trước khi hệ thống gặp sự cố?",[2],["Bằng cách cài đặt lại toàn bộ phần mềm","Bằng cách xóa hết các dữ liệu cũ","Bằng cách khôi phục hệ thống về trạng thái mong muốn trước đó","Bằng cách mã hóa toàn bộ dữ liệu"]],["Hành vi nào sau đây giúp Đồng chí bảo vệ an toàn thông tin cá nhân trên mạng xã hội?",[3],["Chia sẻ địa chỉ nhà và số điện thoại công khai","Chấp nhận tất cả lời mời kết Đồng chí từ người lạ","Đăng nhập vào tài khoản trên mọi thiết bị công cộng","Hạn chế chia sẻ thông tin cá nhân và điều chỉnh cài đặt quyền riêng tư"]],["Đồng chí nên làm gì để đảm bảo các file cũ của mình không làm đầy ổ cứng mà vẫn có thể truy cập khi cần?",[1],["Xóa bỏ chúng hoàn toàn","Nén các file lại và lưu trữ ở một nơi khác","Lưu tất cả vào màn hình Desktop","Thay đổi định dạng file"]],["Hành động nào sau đây là một biện pháp bảo mật cơ bản để phòng tránh tấn công mạng?",[0],["Sử dụng mật khẩu mạnh, bao gồm chữ hoa, chữ thường, số và ký tự đặc biệt","Sử dụng một mật khẩu duy nhất cho tất cả các tài khoản","Không thay đổi mật khẩu trong nhiều năm","Lưu mật khẩu trên máy tính để dễ dàng truy cập"]],["Đồng chí đã nhập tất cả các khoản chi tiêu hàng tháng vào một cột trên Excel. Đồng chí nên sử dụng hàm nào để tính tổng số tiền đã chi?",[2],["AVERAGE","MAX","SUM","COUNT"]],["Để sử dụng một chatbot trí tuệ nhân tạo như ChatGPT để viết email, hoạt động nào là quan trọng nhất trong các hoạt động sau?",[0],["Nhập một lời nhắc (prompt) rõ ràng, càng cụ thể càng tốt trên ChatGPT","Chọn một mẫu email có sẵn","Đăng nhập vào tài khoản email của Đồng chí","Sao chép nội dung từ một email cũ"]],["Đồng chí muốn một công cụ AI tóm tắt một tài liệu dài cho Đồng chí. Đồng chí nên làm gì?",[2],["Chụp ảnh tài liệu đó","Ghi âm tài liệu đó","Sao chép văn bản, tải lên file PDF hoặc dán đường link vào công cụ AI","In tài liệu ra"]],["Khi Đồng chí sử dụng công cụ AI để viết email, điều gì sẽ giúp Đồng chí có được kết quả chính xác và gần với mong muốn của mình nhất?",[3],["Chỉ gõ một từ khóa duy nhất","Yêu cầu công cụ AI tự động viết mà không cần gợi ý","Sử dụng một câu lệnh quá chung chung","Cung cấp một lời nhắc (prompt) càng rõ ràng và cụ thể càng tốt cho công cụ AI"]],["Để tóm tắt một bài báo khoa học dài bằng công cụ AI, Đồng chí nên tìm công cụ chuyên biệt nào cho việc này?",[1],["Một công cụ viết blog","Một công cụ có thể tải lên file PDF và trả lời các câu hỏi về tài liệu đó","Một công cụ chỉ tóm tắt các trang web","Một công cụ tạo hình ảnh"]],["Đồng chí có thể sử dụng các công cụ như Google Sheets hoặc Microsoft Excel để làm gì trong công việc hàng ngày?",[0],["Tạo và quản lý bảng tính, nhập liệu, và sử dụng các hàm tính toán đơn giản","Chỉnh sửa video","Thiết kế đồ họa","Lập trình"]],["Để tạo một bản trình bày chuyên nghiệp trên PowerPoint, Đồng chí có thể làm gì để làm cho nó sống động hơn?",[3],["Gõ thật nhiều chữ vào một trang slide","Chỉ sử dụng văn bản","Chỉ dùng các mẫu có sẵn","Chèn video, hình ảnh, âm thanh và sử dụng các tính năng hoạt hình"]],["Để phân loại dữ liệu một cách hiệu quả, Đồng chí nên dựa vào tiêu chí nào?",[1],["Màu sắc của dữ liệu","Tính hữu dụng, giá trị, và mức độ ảnh hưởng nếu dữ liệu bị rò rỉ","Kích thước của tệp","Tên của người tạo ra dữ liệu"]],["Điều gì sẽ giúp một người mới làm quen với phân tích dữ liệu cảm thấy dễ dàng và thực tế hơn?",[2],["Bắt đầu với các mô hình dự đoán phức tạp","Chỉ làm việc với các phần mềm chuyên nghiệp","Bắt đầu từ các ví dụ đơn giản, ứng dụng trong cuộc sống hàng ngày như lập bảng chi tiêu","Học thuộc lòng các định nghĩa"]],["Quy trình đúng để tổ chức và lưu trữ dữ liệu hiệu quả là gì?",[0],["Phân loại dữ liệu -> Sắp xếp vào thư mục hoặc hệ thống phù hợp -> Đặt tên dễ nhận biết -> Sao lưu định kỳ.","Tạo thật nhiều bản sao dữ liệu -> Lưu rải rác ở nhiều nơi -> Xóa bản gốc để tránh lộ thông tin.","Thu thập dữ liệu -> Phân tích ngay lập tức -> Lưu tạm thời rồi xóa khi đã sử dụng.","Lưu dữ liệu ra thiết bị ngoài (USB) -> Xóa trên hệ thống chính -> Khi cần thì cắm USB sử dụng."]],["Vì sao phân tích dữ liệu lại quan trọng đối với việc ra quyết định trong cơ quan nhà nước?",[0],["Vì phân tích dữ liệu cung cấp bằng chứng và thông tin đáng tin cậy giúp lãnh đạo đưa ra quyết định chính xác hơn.","Vì phân tích dữ liệu làm giảm trách nhiệm của người ra quyết định, giúp đổ lỗi cho máy móc nếu sai.","Vì phân tích dữ liệu chủ yếu là yêu cầu bắt buộc trong quy trình, dù kết quả không ảnh hưởng nhiều đến quyết định.","Vì phân tích dữ liệu sẽ tự động thay thế hoàn toàn việc ra quyết định của con người."]],["Sao lưu (backup) và lưu trữ (archive) dữ liệu khác nhau như thế nào?",[0],["Sao lưu là tạo bản dự phòng để phục hồi khi dữ liệu gốc gặp sự cố, còn lưu trữ là cất giữ dữ liệu ít sử dụng vào nơi lưu trữ lâu dài an toàn.","Sao lưu là lưu dữ liệu trên hệ thống điện toán đám mây, còn lưu trữ là lưu vào thiết bị cục bộ (PC, USB, ổ cứng rời).","Sao lưu chỉ áp dụng cho dữ liệu số, còn lưu trữ chỉ áp dụng cho tài liệu giấy tờ.","Sao lưu và lưu trữ thực chất giống nhau, đều là nhân bản dữ liệu sang nơi khác và xóa bản chính."]],["Công cụ nào sau đây phù hợp để phân tích dữ liệu hỗ trợ ra quyết định trong cơ quan?",[0],["Hệ thống tri thức công việc hoặc công cụ phân tích dữ liệu có hỗ trợ AI (ví dụ: phần mềm BI như Power BI, Tableau) để trực quan hóa và khai thác dữ liệu.","Phần mềm xử lý văn bản (ví dụ: Microsoft Word) để nhập và định dạng dữ liệu thô.","Phần mềm chỉnh sửa hình ảnh để trình bày dữ liệu dưới dạng đồ họa bắt mắt.","Ứng dụng chơi nhạc và video để vừa làm việc vừa giải trí, giúp đầu óc sáng suốt khi phân tích."]],["Bộ Quốc Phòng dự định sử dụng nền tảng điện toán đám mây để lưu trữ và phân tích khối lượng dữ liệu lớn phục vụ chuyển đổi số. Theo anh/chị, vấn đề quan trọng nhất cần cân nhắc để đảm bảo vừa ứng dụng công nghệ số vừa tuân thủ quy định công vụ là gì?",[0],["Đảm bảo hệ thống đám mây đáp ứng các tiêu chuẩn bảo mật của nhà nước, dữ liệu được lưu trữ trên hạ tầng đáng tin cậy (ưu tiên trong nước hoặc môi trường do BQP kiểm soát) để không làm lộ thông tin nhạy cảm.","Lựa chọn dịch vụ đám mây rẻ nhất để tiết kiệm ngân sách, vấn đề bảo mật đã có nhà cung cấp lo.","Sử dụng nhà cung cấp dịch vụ đám mây phổ biến ở nước ngoài vì họ có công nghệ tiên tiến, không cần quan tâm nhiều đến quy định nội bộ.","Đưa toàn bộ dữ liệu lên đám mây và chia sẻ quyền truy cập cho càng nhiều người càng tốt để tận dụng tối đa tài nguyên."]],["Một hệ thống AI phân tích dữ liệu đã đưa ra khuyến nghị điều chỉnh kế hoạch huấn luyện cho các đơn vị dựa trên kết quả phân tích. Lãnh đạo nên sử dụng kết quả từ hệ thống AI này như thế nào cho đúng đắn?",[0],["Xem xét đề xuất của hệ thống AI như một nguồn tham khảo quan trọng, kết hợp với kinh nghiệm thực tiễn và đánh giá của con người trước khi đưa ra quyết định cuối cùng.","Tin tưởng tuyệt đối và làm theo 100% khuyến nghị của hệ thống AI, vì máy móc phân tích thì luôn chính xác hơn người.","Bỏ qua kết quả hệ thống AI đưa ra vì con người mới hiểu thực tế, dữ liệu không thể phản ánh đúng tình hình.","Công bố rộng rãi cho tất cả các đơn vị rằng hệ thống AI sẽ quyết định thay cho lãnh đạo, mọi người chỉ việc làm theo hướng dẫn từ máy."]],["Cơ quan đang tích hợp dữ liệu từ nhiều nguồn (hệ thống nhân sự, tài chính, thông tin tình báo...) để có cái nhìn toàn diện phục vụ chiến lược. Khối dữ liệu tổng hợp này có dung lượng rất lớn và đa dạng. Giải pháp phân tích dữ liệu nâng cao nào nên được áp dụng để xử lý hiệu quả?",[0],["Sử dụng công nghệ phân tích dữ liệu lớn (Big Data) kết hợp thuật toán AI để xử lý đồng thời lượng dữ liệu lớn và đa dạng, trích xuất thông tin hữu ích cho quyết định chiến lược.","Thu hẹp phạm vi dữ liệu, chỉ chọn một nguồn duy nhất và bỏ qua các nguồn khác để giảm tải khối lượng phân tích.","Giao cho một nhóm lớn nhân sự đọc thủ công từng báo cáo từ các nguồn rồi tổng hợp bằng tay để đảm bảo “mắt thấy tai nghe”.","Dừng việc tích hợp vì dữ liệu quá phức tạp, quay về phân tích từng nguồn riêng lẻ và chấp nhận tầm nhìn hạn hẹp hơn để dễ xử lý."]],["Đơn vị X quản lý kho quân nhu bằng hệ thống cơ sở dữ liệu. Để số liệu tồn kho luôn chính xác, biện pháp nào quan trọng nhất?",[1],["Thực hiện sao lưu dữ liệu kho hàng tuần.","Cập nhật thông tin xuất nhập kho theo thời gian thực.","Hạn chế quyền truy cập hệ thống cho một vài người.","Ứng dụng AI dự đoán nhu cầu vật tư trong tương lai."]],["Một viện nghiên cứu quốc phòng lưu trữ dữ liệu dự án vũ khí mới trên hệ thống máy tính. Để bảo vệ dữ liệu mật này trước nguy cơ tấn công mạng, giải pháp nào phù hợp nhất?",[0],["Áp dụng mã hóa dữ liệu và kiểm soát truy cập chặt chẽ.","Chỉ định duy nhất một người giữ bản sao dữ liệu.","Lưu trữ dữ liệu trên máy chủ nội bộ không kết nối internet.","Phân phát dữ liệu rộng rãi trong nội bộ để nhiều người cùng giám sát."]],["Đơn vị huấn luyện thu thập kết quả kiểm tra bắn đạn thật của từng chiến sĩ. Để xác định ai cần rèn luyện thêm về bắn súng, cách phân tích dữ liệu nào hiệu quả nhất?",[1],["Tính điểm bắn trung bình của mỗi người và so sánh với tiêu chuẩn quy định.","Sắp xếp các chiến sĩ theo điểm bắn từ cao đến thấp để tìm nhóm yếu.","Cho mọi người tự đánh giá kỹ năng bắn súng của bản thân.","Sử dụng phần mềm soạn thảo văn bản để ghi chép kết quả bắn."]],["Các huấn luyện viên áp dụng một hệ thống AI theo dõi thành tích luyện tập của từng binh sĩ và tự động điều chỉnh độ khó bài tập cho phù hợp. Lợi ích chính của cách tiếp cận dựa trên dữ liệu này là gì?",[2],["Tự động giám sát và báo cáo vi phạm kỷ luật của binh sĩ trong quá trình huấn luyện.","Đảm bảo mọi binh sĩ đều đạt kết quả giống nhau sau huấn luyện.","Cá nhân hóa chương trình huấn luyện theo điểm mạnh và điểm yếu của từng binh sĩ.","Loại bỏ hoàn toàn sự cần thiết của huấn luyện viên con người."]],["Một đơn vị bảo mật thông tin sử dụng hệ thống AI để phát hiện xâm nhập mạng máy tính quân sự. Ưu điểm nào của hệ thống AI này so với phương pháp phát hiện truyền thống?",[0],["Có thể nhận diện cả những kiểu tấn công mới chưa từng biết đến.","Đảm bảo không một cuộc tấn công mạng nào có thể thành công.","Không cần nhân viên an ninh mạng giám sát hệ thống nữa.","Chỉ có thể phát hiện các kiểu tấn công đã được định nghĩa trước trong cơ sở dữ liệu."]],["Chỉ huy cần phân bổ nhiên liệu dự trữ cho các đơn vị. Dữ liệu cho thấy mỗi đơn vị có mức tiêu thụ nhiên liệu và nhiệm vụ sắp tới khác nhau. Phân tích dữ liệu nào sẽ giúp phân bổ tối ưu nhất?",[2],["Phân bổ nhiên liệu bằng nhau cho tất cả các đơn vị bất kể nhiệm vụ.","Dựa trên định mức nhiên liệu cố định của năm trước để phân bổ cho mỗi đơn vị.","Phân tích dự báo nhu cầu nhiên liệu của mỗi đơn vị dựa trên dữ liệu sử dụng quá khứ và nhiệm vụ sắp tới.","Ưu tiên đơn vị có nhiệm vụ quan trọng nhất, cung cấp nhiên liệu tối đa cho họ, nhiên liệu còn lại chia đều cho các đơn vị khác."]],["Một hệ thống vũ khí thông minh sử dụng hệ thống AI để nhận dạng mục tiêu trên chiến trường dựa trên hình ảnh camera. Rủi ro nào dưới đây cần được lưu ý khi triển khai hệ thống AI này?",[3],["Hệ thống AI sẽ tự động khai hỏa vào mục tiêu mà không cần sự cho phép của người chỉ huy.","Hệ thống AI đòi hỏi băng thông rất lớn để truyền hình ảnh, gây trễ khi nhận diện mục tiêu.","Đối phương có thể sử dụng ngụy trang hoặc gây nhiễu để đánh lừa hệ thống nhận dạng của hệ thống AI.","Hệ thống AI có thể nhận dạng sai mục tiêu nếu dữ liệu huấn luyện bị thiếu hoặc thiên lệch."]],["Một đơn vị quân đội sử dụng mô phỏng trận chiến có tích hợp AI để thử nghiệm các kế hoạch tác chiến trước khi thực chiến. Lợi ích quan trọng nhất của việc sử dụng mô phỏng dữ liệu này là gì?",[0],["Cho phép thử nghiệm nhanh nhiều kịch bản chiến thuật khác nhau mà không gây thương vong thực tế.","Mô phỏng sẽ tự động chỉ huy binh lính trên thực địa thay cho sĩ quan chỉ huy.","Đảm bảo sau khi mô phỏng thì kế hoạch tác chiến sẽ thành công 100% trên thực tế.","Loại bỏ hoàn toàn yếu tố con người trong quá trình lên kế hoạch và ra quyết định."]],["Khi tiếp nhận dữ liệu từ nhiều nguồn khác nhau, hành động nào giúp đồng chí đảm bảo dữ liệu \"đáng tin cậy\" trước khi sử dụng?",[2],["Sử dụng ngay để tiết kiệm thời gian","Chỉ dựa vào nguồn quen thuộc mà không kiểm tra","Kiểm chứng, đối chiếu thông tin, loại bỏ dữ liệu sai hoặc không rõ nguồn gốc","Chỉ chọn dữ liệu có dung lượng nhỏ để dễ xử lý"]],["Khi sắp chuyển công tác, để bàn giao dữ liệu đúng cách đồng chí nên:",[2],["Sao chép dữ liệu ra USB và giữ cho mình","Chia sẻ toàn bộ dữ liệu công khai","Chuyển giao dữ liệu qua hệ thống quản lý chính thức và phân quyền lại cho người kế nhiệm","Xóa dữ liệu để không ai sử dụng"]],["Khi cần chia sẻ tài liệu nội bộ nhưng muốn đảm bảo người ngoài không thể truy cập được. Đồng chí nên:",[1],["Đặt tài liệu trên mạng xã hội nhưng ẩn link","Chia sẻ qua hệ thống nội bộ có xác thực tài khoản và phân quyền","Gửi file qua email cá nhân để giảm rủi ro","Lưu trên USB và chuyền tay nhau"]],["Đồng chí được giao biên tập bài viết trên website của đơn vị. Sau khi chỉnh sửa, đồng chí cần là gì để đảm bảo nội dung hiển thị đúng?",[1],["Xuất bản ngay không kiểm tra","Xem trước (preview) bài viết trước khi xuất bản chính thức","Sao chép nội dung ra Word để in kiểm tra","Để đồng nghiệp tự xem sau khi đăng"]],["Để nhanh chóng tìm nội dung trong một file PDF dài 200 trang, đồng chí nên làm gì?",[1],["Đọc toàn bộ từ đầu đến cuối","Sử dụng chức năng tìm kiếm (Ctrl+F) hoặc mục lục tự động","In ra để dễ dò tìm","Nhờ đồng nghiệp đọc hộ"]],["Đồng chí cần gửi tài liệu mật cho cấp trên. Để tránh người ngoài đọc và chỉnh sửa trái phép, đồng chí nên:",[1],["Gửi tệp Microsoft Word gốc","Chuyển sang tệp tài liệu định dạng PDF","Gửi ảnh chụp màn hình tài liệu","Gửi file qua ứng dụng trò chuyện trực tuyến không bảo mật"]],["Đồng chí cần làm gì để tổ chức dữ liệu hiệu quả?",[0],["Sử dụng cấu trúc thư mục rõ ràng và đặt tên nhất quán","Đặt tên tệp tin bằng ký tự ngẫu nhiên","Không phân loại dữ liệu theo chủ đề","Lưu tất cả dữ liệu vào một thư mục duy nhất"]],["Để tìm kiếm lại tài liệu dễ dàng và nhanh chóng sau nhiều năm, đồng chí nên làm gì?",[2],["Kiểm tra từng thư mục","Nhờ đồng nghiệp kiểm tra hộ","Nhập từ khóa vào hộp tìm kiếm của File Explorer","Làm lại tài liệu mới"]],["Trong quá trình xử lý dữ liệu, đồng chí phát hiện một số bản ghi bị trùng lặp. Đồng chí cần làm gì?",[1],["Xóa toàn bộ dữ liệu để làm lại từ đầu","Sử dụng công cụ lọc, so sánh, loại bỏ hoặc hợp nhất dữ liệu trùng lặp","Bỏ qua vì số liệu trùng lặp không ảnh hưởng","Ghi chú bằng tay từng dòng bị trùng"]],["Khi quản lý thông tin cá nhân của cả đơn vị, đồng chí cần làm gì để bảo đảm tính bảo mật?",[1],["Lưu thông tin ở dạng bảng tính mở công khai để mọi người dễ tham khảo","Cài đặt mật khẩu, đặt quyền truy cập phù hợp, và tuân thủ quy định bảo mật","Sao chép dữ liệu lên mạng xã hội để tiện sử dụng","Gửi qua email cá nhân để lưu trữ"]],["Khi chuẩn bị tài liệu cho một buổi thuyết trình, đồng chí cần đảm bảo file được hiển thị đúng định dạng ở nhiều máy tính. Đồng chí nên làm gì?",[0],["Lưu file ở định dạng mở (PDF, PPTX) và kiểm tra khả năng đọc được trên nhiều thiết bị","Chỉ lưu bản gốc trên máy cá nhân","Dùng phần mềm riêng mà chỉ đồng chí có","Sao chép file nhiều lần để dự phòng"]],["Đồng chí đang dọn dẹp kho dữ liệu cũ. Hoạt động nào sau đây giúp tránh mất thông tin quan trọng?",[1],["Xóa toàn bộ dữ liệu cũ","Sao lưu dữ liệu quan trọng trước khi dọn dẹp","Chia sẻ dữ liệu cho mọi người rồi mới xóa","Giữ nguyên vì có thể mất dữ liệu"]],["Đồng chí cần tìm tài liệu cũ trong kho dữ liệu hàng nghìn file. Kỹ năng nào giúp nhanh nhất?",[1],["Tìm thủ công từng thư mục","Sử dụng công cụ tìm kiếm","Hỏi đồng nghiệp từng người","Tải hết về máy và kiểm tra"]],["Đồng chí đang quản lý nhiều file quan trọng. Để tránh rủi ro khi mất điện hoặc hỏng máy, Đồng chí nên:",[1],["Chỉ lưu trên ổ cứng máy tính","Kích hoạt chế độ tự động lưu (auto-save) và đồng bộ với dịch vụ đám mây","Sao chép ra USB mỗi ngày","Không cần làm gì vì rủi ro thấp"]],["Trong khi lưu trữ tài liệu dài hạn, định dạng nào nên được ưu tiên để đảm bảo dễ mở về sau?",[0],["Định dạng chuẩn mở (PDF/A, CSV)","Định dạng phần mềm độc quyền ít người dùng","Lưu ở dạng nén riêng của máy tính","Chỉ giữ file ảnh chụp"]],["Trong một kho dữ liệu lớn, nhiều file trùng lặp khiến dung lượng tăng nhanh. Kỹ năng cần áp dụng là:",[1],["Xóa ngẫu nhiên các file để giảm dung lượng","Dùng công cụ quản lý dữ liệu để phát hiện và loại bỏ file trùng lặp","Nén toàn bộ dữ liệu lại để tiết kiệm dung lượng","Thêm ổ cứng để chứa file trùng"]],["Đồng chí cần lưu trữ tài liệu quan trọng lâu dài. Cách nào là hiệu quả?",[1],["Lưu trên phần mềm cũ không còn hỗ trợ","Chuyển sang định dạng chuẩn mở (PDF/A, CSV) và sao lưu nhiều bản","Lưu trên ổ cứng duy nhất","Lưu trên máy cá nhân mà không sao lưu"]],["Trong trường hợp Đồng chí phải xóa dữ liệu nhạy cảm, cách làm nào đảm bảo dữ liệu không thể khôi phục?",[2],["Xóa file bằng phím Delete","Đưa file vào thùng rác","Sử dụng phần mềm xóa an toàn","Đổi tên file để không ai nhận ra"]],["Trong kho dữ liệu tài liệu, nhiều file bị đặt tên “a, b, ...”. Hành động nào giúp dễ quản lý hơn?",[1],["Giữ nguyên vì phần mềm tự đặt tên","Đặt lại tên file chứa các thông tin: ngày, sự kiện, người phụ trách, nội dung.","Lưu ảnh vào nhiều thư mục rời rạc","Đổi tên file theo cảm hứng"]],["Khi quản lý dữ liệu nhiều năm, để tránh file hỏng hoặc không mở được, Đồng chí nên:",[1],["Lưu ở định dạng cũ và không đổi","Định kỳ kiểm tra, chuyển sang định dạng chuẩn mở và sao lưu","Chỉ giữ bản in giấy","Chỉ để file trên máy tính không bật internet"]],["Khi cần tổng hợp nội dung từ nhiều tài liệu dài, đồng chí nên:",[1],["Đọc toàn bộ và viết lại nguyên văn","Tóm tắt, phân loại theo chủ đề, rút ra điểm chính để báo cáo","Sao chép toàn bộ rồi gộp vào một file","Chỉ lấy tài liệu dễ đọc"]],["Đồng chí có một tập dữ liệu Excel lớn và muốn phát hiện xu hướng nhanh chóng. Cách hiệu quả nhất là:",[3],["Đọc toàn bộ bảng bằng mắt thường","Sao chép sang Microsoft Word để dễ đọc hơn","In ra giấy và gạch chân thủ công","Dùng biểu đồ, bảng tổng hợp (Pivot Table) để trực quan hóa dữ liệu"]],["Đồng chí cần chuyển đổi kho dữ liệu cũ sang kho mới. Bước quan trọng là:",[1],["Sao chép toàn bộ mà không kiểm tra","Lập kế hoạch di chuyển dữ liệu, kiểm thử và xác nhận tính toàn vẹn sau chuyển đổi","Chỉ giữ lại file gần đây","Chia nhỏ và gửi cho từng người giữ"]],["Một phân tích viên cần hợp nhất hàng trăm tệp dữ liệu văn bản và làm sạch nội dung trước khi phân tích. Phương án nào hiệu quả và tự động hóa tốt nhất trong trường hợp này?",[1],["Mở lần lượt từng tệp bằng Excel và làm sạch dữ liệu thủ công cho từng tệp.","Sử dụng Python cùng các thư viện phù hợp để viết script hợp nhất và làm sạch toàn bộ dữ liệu tự động.","In tất cả các tệp ra giấy rồi thủ công lọc bỏ những thông tin không cần thiết.","Nhập thủ công dữ liệu từ từng tệp vào chung một bảng tính duy nhất để tiện phân tích."]],["Một nhân viên vừa thu thập dữ liệu có chứa thông tin nhạy cảm thuộc phạm vi bí mật nhà nước. Theo quy định, đâu là cách lưu trữ dữ liệu này an toàn và đúng pháp luật nhất?",[1],["Tải dữ liệu lên tài khoản lưu trữ đám mây cá nhân để có thể tiếp tục làm việc tại nhà.","Lưu dữ liệu vào ổ cứng nội bộ được mã hóa hoặc hệ thống lưu trữ bảo mật được cơ quan cho phép sử dụng.","Gửi toàn bộ dữ liệu qua email cá nhân để tiện làm việc ngoài giờ hành chính.","Sao chép dữ liệu ra thiết bị USB cá nhân và mang về nhà cất giữ để đề phòng mất mát."]],["Một chuyên viên cần chia sẻ dữ liệu nội bộ cho đồng nghiệp ở phòng ban khác trong cơ quan. Dữ liệu này không thuộc loại mật, nhưng vẫn là thông tin nội bộ cần được bảo vệ. Phương án nào sau đây tuân thủ đúng quy định về bảo mật khi chia sẻ dữ liệu?",[2],["Tải dữ liệu lên Google Drive cá nhân của mình rồi gửi đường link cho đồng nghiệp để họ truy cập cho nhanh.","Nhờ một người quen ở ngoài cơ quan phân tích giúp, sau đó gửi kết quả cho đồng nghiệp qua tài khoản mạng xã hội cá nhân.","Sử dụng nền tảng chia sẻ dữ liệu nội bộ của cơ quan hoặc gửi file qua email công vụ đã được mã hóa.","Đăng tệp dữ liệu lên một diễn đàn công cộng trên internet rồi gửi đường liên kết cho đồng nghiệp để tải về."]],["Một cán bộ cần tra cứu dữ liệu cũ đã được lưu trữ theo chế độ lưu trữ của cơ quan. Để đảm bảo tuân thủ quy trình truy xuất dữ liệu, người này nên làm gì?",[0],["Thực hiện yêu cầu truy xuất thông qua hệ thống quản lý lưu trữ chính thức của cơ quan theo đúng quy trình.","Tự ý truy cập trực tiếp vào kho lưu trữ dữ liệu mà không thông báo, vì người này vốn là người tạo ra dữ liệu đó.","Mượn tạm tài khoản của đồng nghiệp có quyền truy cập cao hơn để tra cứu cho nhanh, rồi trả lại tài khoản sau.","Liên hệ bộ phận bên ngoài cơ quan để nhờ dò tìm dữ liệu trong hệ thống lưu trữ nội bộ nhằm tiết kiệm thời gian."]],["Lãnh đạo Bộ Quốc Phòng muốn dự báo nhu cầu ngân sách và vật tư cho năm tới dựa trên khối lượng dữ liệu lớn về sử dụng ngân sách, vật tư của 5 năm gần đây từ các đơn vị. Cách tiếp cận nào hiệu quả để hỗ trợ ra quyết định trong tình huống này?",[0],["Sử dụng trí tuệ nhân tạo dự báo (Predictive AI), ví dụ áp dụng thuật toán máy học trên dữ liệu lịch sử để dự đoán xu hướng tương lai, cung cấp cơ sở khoa học cho quyết định.","Lấy số liệu năm ngoái rồi giữ nguyên cho năm sau, vì cách đơn giản nhất là giả định năm sau giống năm trước.","Mời tất cả chỉ huy các đơn vị họp và yêu cầu họ đoán con số dựa trên kinh nghiệm, không cần xem dữ liệu.","Phân công một nhân viên nhập thủ công toàn bộ dữ liệu vào bảng tính rồi tự tính toán dựa trên cảm tính cá nhân."]],["Để bảo trì trang thiết bị quân sự, Bộ Quốc Phòng thu thập dữ liệu cảm biến từ hàng ngàn thiết bị và báo cáo sự cố từ các đơn vị. Khối lượng dữ liệu này rất lớn và phức tạp. Làm thế nào để phát hiện sớm thiết bị nào có nguy cơ hỏng hóc trong thời gian tới?",[0],["Áp dụng công cụ AI phân tích dữ liệu lớn (ví dụ: thuật toán máy học phân tích dữ liệu cảm biến) nhằm phát hiện các mẫu bất thường và dự báo thiết bị có rủi ro cao, giúp chủ động bảo trì.","Chờ cho đến khi thiết bị hỏng rồi mới thay thế, vì không thể xử lý hết dữ liệu cảm biến thủ công kịp thời.","Chỉ dựa vào lịch bảo trì cố định theo thời gian, bỏ qua dữ liệu cảm biến vì dữ liệu quá nhiều để phân tích.","Phân tích thủ công một vài mẫu báo cáo sự cố tiêu biểu, coi đó là đại diện cho tất cả, do không thể xem hết dữ liệu."]],["Công cụ tìm kiếm là gì?",[1],["Trình duyệt web","Một công cụ cho phép người dùng tìm kiếm và đọc thông tin trên internet","Phần mềm soạn thảo văn bản","Phần mềm quản lý máy tính"]],["Google Tìm kiếm là sản phẩm của công ty nào?",[2],["Apple","Microsoft","Google LLC","Amazon"]],["ChatGPT được phát triển bởi công ty nào?",[0],["OpenAI","Microsoft","Meta","IBM"]],["Prompt trong ChatGPT là gì?",[1],["Phần mềm chỉnh sửa ảnh","Yêu cầu hoặc câu hỏi mà người dùng nhập để nhận được phản hồi từ AI","Loại virus máy tính","Phần mềm gõ tiếng Việt"]],["Để tìm kiếm chính xác cụm “chuyển đổi số”, nên nhập như thế nào?",[1],["chuyển đổi số","\"chuyển đổi số\"","(chuyển đổi số)","#chuyểnđổi số"]],["Cốc Cốc là công cụ tìm kiếm do nước nào phát triển?",[0],["Việt Nam","Nhật Bản","Mỹ","Trung Quốc"]],["Đâu là công cụ tìm kiếm phổ biến trên thế giới?",[0],["Google","Paint","Zalo","Word"]],["Khi nhập từ khóa vào Google, kết quả thường xuất hiện ở đâu?",[1],["Trong máy tính","Trên trình duyệt web","Trong Zalo","Trong Excel"]],["Công cụ tìm kiếm hoạt động trên nền tảng nào?",[1],["Hệ điều hành Windows","Internet","Mạng nội bộ LAN","Ứng dụng Zalo"]],["Người dùng có thể sử dụng ChatGPT để làm gì?",[0],["Tìm kiếm, viết nội dung, học tập","Tạo video ca nhạc","Chơi game online","Cài đặt phần mềm Windows"]],["Đâu là trình duyệt web do Việt Nam phát triển?",[0],["Trình duyệt Cốc Cốc","Google Chrome","Internet Explorer","Safari"]],["Để tải Mozilla Firefox, người dùng cần làm gì?",[1],["Tìm trong Zalo","Tìm kiếm và tải từ trang chủ Mozilla","Tìm trên YouTube","Mở Word rồi gõ tên"]],["Khi truy cập vào website, người dùng nên kiểm tra điều gì để đảm bảo an toàn?",[3],["Tên miền lạ","Không cần kiểm tra gì cả","Trang có quảng cáo đẹp","Biểu tượng ổ khóa và HTTPS"]],["Khi sử dụng Google Tìm kiếm, dấu ngoặc kép có tác dụng gì?",[2],["Tìm hình ảnh","Tìm video","Giữ chính xác cụm từ cần tìm","Tìm trang web tiếng Anh"]],["Zalo có thể sử dụng để làm gì?",[1],["Chơi game trực tuyến","Tạo tài khoản, nhắn tin, gọi điện miễn phí","Học lập trình","Xem phim HD"]],["Vì sao nên sử dụng dấu * khi tìm kiếm trên Google?",[1],["Tăng tốc độ lướt web","Tìm kiếm từ khóa thay thế (wildcard)","Tìm từ viết tắt","Hiển thị trang web ngẫu nhiên"]],["Google Dịch có thể dùng để làm gì?",[1],["Làm bảng tính","Dịch văn bản, giọng nói, hình ảnh","Gửi email hàng loạt","Tạo trình chiếu"]], hể cần bổ sung thêm giấy tờ tích hợp vào tài khoản Định danh điện tử và liên hệ vì đã có số điện thoại lưu trong hệ thống","Tùy vào nội dung cơ quan công an yêu cầu mà cân nhắc thực hiện theo hay không","Chỉ cung cấp thông tin về bảo hiểm y tế, giấy phép lái xe, đăng ký xe cho người gọi điện; không cung cấp thông tin tài khoản ngân hàng"]],["Khi nào thì tài khoản Định danh điện tử công dân bị khóa",[3],["Chủ thể danh tính điện tử yêu cầu khóa tài khoản định danh điện tử của mình; chủ thể danh tính điện tử vi phạm điều khoản sử dụng ứng dụng VNelD; chủ thể danh tính điện tử bị thu hồi thẻ Căn cước công dân; chủ thể danh tính điện tử chết","Cơ quan tiến hành tố tụng, cơ quan chức năng có thẩm quyền hoặc bên sử dụng dịch vụ có yêu cầu khóa tài khoản định danh điện tử gửi đề nghị khóa tài khoản tới cơ quan Công an để xem xét, giải quyết","Tòa án nhân dân các cấp ra quyết định khóa tài khoản định danh điện tử","Đáp án 1 và 2"]],["Thời gian thẩm định hồ sơ đề nghị đưa hệ thống thông tin vào Danh mục hệ thống thông tin quan trọng về an ninh quốc gia?",[0],["30 ngày kể từ ngày nhận đủ hồ sơ Không có chỉnh sửa","20 ngày kể từ ngày nhận đủ hồ sơ Không có chỉnh sửa","21 ngày kể từ ngày nhận đủ hồ sơ Không có chỉnh sửa","25 ngày kể từ ngày nhận đủ hồ sơ Không có chỉnh sửa"]],["Theo Luật An ninh mạng, nội dung triển khai hoạt động bảo vệ an ninh mạng bao gồm?",[3],["Xây dựng, hoàn thiện quy định, quy chế sử dụng mạng máy tính nội bộ, mạng máy tính có kết nối mạng Internet; phương án bảo đảm an ninh mạng đối với hệ thống thông tin; phương án ứng phó, khắc phục sự cố an ninh mạng. Đầu tư, xây dựng hạ tầng cơ sở vật chất phù hợp với điều kiện bảo đảm triển khai hoạt động bảo vệ an ninh mạng đối với hệ thống thông tin","Ứng dụng, triển khai phương án, biện pháp, công nghệ bảo vệ an ninh mạng đối với hệ thống thông tin và thông tin, tài liệu được lưu trữ, soạn thảo, truyền đưa trên hệ thống thông tin thuộc phạm vi quản lý","Tổ chức bồi dưỡng kiến thức về an ninh mạng cho cán bộ, công ghệ","Văn phòng Chính phủ"]],["Ba trụ cột của chuyển đổi số là gì?",[0],["Chính phủ số, kinh tế số, xã hội số","Công nghiệp hóa, hiện đại hóa, tự động hóa","Chuyển đổi công nghệ, dữ liệu, mô hình","Kết nối số, công nghệ số, quản trị số"]],["Theo Quyết định 749/QĐ-TTg, năm nào là mốc phấn đấu hoàn thành Chính phủ số?",[1],["2023","2025","2030","2045"]],["Mục tiêu của chuyển đổi số trong doanh nghiệp là gì?",[3],["Tăng hiệu quả vận hành","Cải thiện trải nghiệm khách hàng","Tối ưu chi phí","Tất cả các phương án trên"]],["Hệ thống nào giúp kết nối, chia sẻ dữ liệu giữa các cơ quan nhà nước?",[3],["Hệ thống dữ liệu dùng chung","Trục liên thông quốc gia","Trung tâm dữ liệu quốc gia","Nền tảng tích hợp chia sẻ dữ liệu (NDXP)"]],["Doanh nghiệp nhỏ nên bắt đầu chuyển đổi số từ đâu?",[3],["Xây dựng website","Đào tạo nhân sự","Chuyển đổi văn hóa doanh nghiệp","Phân tích quy trình và số hóa dần dần"]],["Dữ liệu lớn (Big Data) có vai trò gì trong chuyển đổi số?",[0],["Hỗ trợ ra quyết định","Lưu trữ thông tin cơ bản","Thay thế hệ thống nhân sự","Chỉ phục vụ phân tích tài chính"]],["Kỹ năng quan trọng nhất cho cán bộ trong chuyển đổi số là gì?",[0],["Kỹ năng số","Ngoại ngữ","Lái xe","Vận hành máy tính cơ bản"]],["Chuyển đổi số trong y tế mang lại lợi ích nào?",[3],["Khám bệnh từ xa","Quản lý hồ sơ sức khỏe điện tử","Giảm tải bệnh viện","Tất cả các phương án trên"]],["Trong học tập, chuyển đổi số giúp gì cho người học?",[0],["Tiếp cận học liệu mọi lúc mọi nơi","Chỉ học trực tiếp","Tăng lệ thuộc thiết bị","Giảm hiệu quả học tập"]],["Tài khoản định danh điện tử hỗ trợ gì trong chuyển đổi số?",[3],["Giao dịch không giấy tờ","Xác minh danh tính số","Thực hiện dịch vụ công","Tất cả các phương án trên"]],["Yếu tố nào là then chốt để chuyển đổi số thành công?",[3],["Hạ tầng công nghệ","Ý chí chính trị","Nguồn lực tài chính","Thay đổi tư duy, văn hóa tổ chức"]],["Mức độ cao nhất của dịch vụ công trực tuyến là?",[2],["Mức 2","Mức 3","Mức 4 - toàn trình","Mức 1"]],["Nền tảng số là gì?",[2],["Ứng dụng đơn lẻ","Tập hợp công cụ cho số hóa","Hệ thống tích hợp nhiều dịch vụ số","Chỉ là website và app"]],["Cơ sở dữ liệu quốc gia về dân cư do cơ quan nào quản lý?",[2],["Bộ Thông tin và Truyền thông","Bộ Kế hoạch và Đầu tư","Bộ Công an","Bộ Y tế"]],["Chuyển đổi số có ảnh hưởng gì đến lao động?",[3],["Thay đổi mô tả công việc","Cần kỹ năng mới","Tạo cơ hội việc làm mới","Tất cả các phương án trên"]],["Theo quy định tại Nghị định số 42/2022/NĐ-CP ngày 24/6/2022 của Chính phủ thì dịch vụ công trực tuyến của cơ quan nhà nước có những mức độ nào dưới đây?",[2],["Có 1 mức độ: Dịch vụ công trực tuyến toàn trình.","Có 2 mức độ: Dịch vụ công trực tuyến toàn trình, Dịch vụ công trực tuyến một phần.","Có 4 mức độ: Mức độ 1, mức độ 2, mức độ 3, mức độ 4.","Có 3 mức độ: Mức độ 1, mức độ 2, mức độ 3."]],["Dịch vụ công trực tuyến toàn trình của cơ quan nhà nước là gì?",[2],["Là dịch vụ bảo đảm cung cấp một phần thông tin về thủ tục hành chính, việc thực hiện và giải quyết thủ tục hành chính đều được thực hiện trên môi trường mạng.","Là dịch vụ bảo đảm chỉ cung cấp toàn bộ thông tin việc thực hiện thủ tục hành chính trên môi trường mạng.","Là dịch vụ bảo đảm cung cấp toàn bộ thông tin về thủ tục hành chính, việc thực hiện và giải quyết thủ tục hành chính đều được thực hiện trên môi trường mạng. Việc trả kết quả được thực hiện trực tuyến hoặc qua dịch vụ bưu chính công ích.","Là dịch vụ bảo đảm chỉ cung cấp toàn bộ thông tin việc giải quyết thủ tục hành chính trên môi trường mạng."]],["Theo quy định của Luật Cư trú, Sổ hộ khẩu, Sổ tạm trú đã được cấp vẫn đợc sử dụng và có giá trị như giấy tờ, tài liệu xác nhận về cư trú cho đến thời điểm nào sau đây?",[3],["Đến ngày 01/07/2022.","Đến hết ngày 31/12/2023.","Đến hết ngày 31/12/2022.","Đến hết ngày 01/7/2023."]],["Đâu là Cổng dịch vụ công quốc gia?",[0],["https://dichvucong.gov.vn","https://dichvucongquocgia.gov.vn","https://hanhchinhcong.gov.vn","https://dichvucongqg.gov.vn"]],["Đâu là phát biểu đúng nhất về mã QR?",[0],["Là một dạng thông tin được mã hóa để hiển thị sao cho máy có thể đọc được và giải mã, hiển thị nội dung cho người dùng biết","Là một dãy các chữ số được mã hóa để dán vào các sản phẩm","Là một dãy thông tin ẩn được mã hóa để bảo mật thông tin","Là mã vuông hình gắn logo do phần mềm mã hóa tạo ra"]],["Người dân cần làm gì để tham gia chuyển đổi số?",[3],["Biết sử dụng các thiết bị kết nối như máy tính, điện thoại thông minh","Biết sử dụng Internet, biết cách thanh toán trực tuyến","Có kỹ năng, khả năng bảo đảm an toàn khi tham gia môi trường số","Tất cả các đáp án"]],["Hiểu thế nào về khái niệm dịch vụ công trực tuyến của cơ quan nhà nước?",[1],["Dịch vụ công trực tuyến là dịch vụ hành chính công và các dịch vụ khác của cơ quan nhà nước được cung cấp cho các tổ chức, cá nhân","Dịch vụ công trực tuyến của cơ quan nhà nước là dịch vụ hành chính công và các dịch vụ khác của cơ quan nhà nước được cung cấp cho các tổ chức, cá nhân trên môi trường mạng","Dịch vụ công trực tuyến là các thủ tục hành chính của cơ quan nhà nước được cung cấp cho các tổ chức, cá nhân trên môi trường mạng","Dịch vụ công trực tuyến là giao dịch công được thực hiện trên môi trường trực tuyến"]],["Chuyển đổi số là gì?",[3],["Chuyển đổi số là bước phát triển tiếp theo của tin học hóa (ứng dụng công nghệ thông tin, số hóa quy trình nghiệp vụ đã có ở mức cao), có được nhờ sự tiến bộ vượt bậc của những công nghệ mới mang tính đột phá, nhất là công nghệ số","Chuyển đổi số là khai thác các dữ liệu có được từ quá trình số hoá, rồi áp dụng các công nghệ để phân tích, biến đổi các dữ liệu đó và tạo ra các giá trị mới hơn","Chuyển đổi số là quá trình thay đổi tổng thể và toàn diện của cá nhân, tổ chức về cách sống, cách làm việc và phương thức sản xuất dựa trên các công nghệ số","Tất cả các đáp án"]],["Phát biểu nào sau đây là đúng nhất khi nói về công dân số?",[1],["Công dân có định danh số","Người có kỹ năng sử dụng công nghệ thông tin, công nghệ số để giao tiếp với người khác, tham gia vào các hoạt động xã hội, kinh doanh và chính trị trên nền tảng số","Công dân có kỹ năng số cơ bản","Công dân có thể mua bán hàng hóa trên mạng"]],["Người dân sẽ được lợi ích gì khi tham gia chuyển đổi số?",[3],["Được cung cấp dịch vụ tốt hơn","Có thể tiếp cận toàn bộ thị trường nhanh chóng trong môi trường số","Mang đến cơ hội bình đẳng cho người dân về tiếp cận dịch vụ, nâng cao chất lượng cuộc sống","Tất cả các đáp án"]],["Theo Quyết định 874/QĐ-BTTTT ngày 17/6/2021 của Bộ Thông tin và Truyền thông về việc ban hành Bộ Quy tắc ứng xử trên mạng xã hội. Đâu không phải là quy tắc ứng xử của cơ quan nhà nước trên mạng xã hội?",[3],["Thực hiện nội dung quy định cho cơ quan, tổ chức nêu tại Điều 4 Quyết định 874/QĐ-BTTTT","Có trách nhiệm quản lý, bảo mật tài khoản mạng xã hội và nhanh chóng thông báo nhà cung cấp dịch vụ khi tài khoản của cơ quan nhà nước, tổ chức bị mất quyền kiểm soát hoặc giả mạo","Cung cấp thông tin trên mạng xã hội đồng bộ, thống nhất với thông tin đã được cung cấp trên phương tiện truyền thông chính thống khác","Không tham gia ý kiến bình luận, phản hồi thông tin trên mạng xã hội"]],["Theo Luật An ninh mạng năm 2018, “an ninh mạng” là gì?",[2],["Là sự giám sát hoạt động trên không gian mạng không gây phương hại đến an ninh quốc gia, trật tự, an toàn xã hội, quyền và lợi ích hợp pháp của cơ quan, tổ chức, cá nhân","Là sự kiểm tra hoạt động trên không gian mạng không gây phương hại đến an ninh quốc gia, trật tự, an toàn xã hội, quyền và lợi ích hợp pháp của cơ quan, tổ chức, cá nhân","Là sự bảo đảm hoạt động trên không gian mạng không gây phương hại đến an ninh quốc gia, trật tự, an toàn xã hội, quyền và lợi ích hợp pháp của cơ quan, tổ chức, cá nhân","Là sự phòng ngừa, phát hiện, ngăn chặn, xử lý hành vi xâm phạm an ninh mạng"]],["Theo Luật An ninh mạng năm 2018, thông tin trên không gian mạng có nội dung tuyên truyền chống Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam bao gồm:",[3],["Tuyên truyền xuyên tạc, phỉ báng chính quyền nhân dân","Chiến tranh tâm lý, kích động chiến tranh xâm lược, chia rẽ, gây thù hận giữa các dân tộc, tôn giáo và nhân dân các nước","Xúc phạm dân tộc, quốc kỳ, quốc huy, quốc ca, vĩ nhân, lãnh tụ, danh nhân, anh hùng dân tộc","Tất cả đáp áp trên"]],["Phát biểu đúng nhất về lợi ích chuyển đổi số trong học tập là gì?",[0],["Giúp học tập mọi lúc, mọi nơi","Bị hạn chế khả năng tiếp cận nhiều tài liệu học tập","Tiếp cận nguồn tài liệu khổng lồ và phải trả chi phí nhiều hơn","Giới hạn việc tìm kiếm thông tin"]],["Lợi ích chuyển đổi số trong giáo dục và đào tạo?",[3],["Tạo môi trường giáo dục linh động và truy cập tài liệu học tập mọi lúc, mọi nơi","Tăng tính tương tác và trải nghiệm thực tế","Nâng cao chất lượng giáo dục và giảm chi phí đào tạo","Tất cả các đáp án"]],["Các công nghệ thúc đẩy chuyển đổi số trong lĩnh vực y tế là gì?",[3],["Khám chữa bệnh từ xa (Telemedicine)","Theo dõi từ xa (Remote Patient Monitoring - RPM)","Công nghệ thực tế ảo tăng cường (VR&AR)","Tất cả các đáp án"]],["Những thách thức khi triển khai chuyển đổi số trong ngành giáo dục và đào tạo?",[3],["Thách thức về phát triển hạ tầng số ở vùng khó khăn, vùng sâu, vùng xa, biên giới, hải đảo","Đòi hỏi thay đổi tư duy và năng lực quản lý, làm chủ công nghệ","Thói quen giảng dạy và học tập truyền thống","Tất cả các đáp án"]],["Ứng dụng chính thức của Bảo hiểm xã hội Việt Nam trên nền tảng thiết bị di động là gì?",[0],["VssID","VNeID","VinID","VnID"]],["Theo Quyết định số 505/QĐ-TTg ngày 22/04/2022 của Thủ tướng Chính phủ, Ngày chuyển đổi số Quốc gia là ngày nào?",[3],["Ngày 30 tháng 4 hằng năm","Ngày 19 tháng 8 hằng năm","Ngày 02 tháng 9 hằng năm","Ngày 10 tháng 10 hằng năm"]],["Chuyển đổi số là chuyển đổi, dịch chuyển những gì?",[3],["Tư duy con người trong tổ chức","Công nghệ","Quy trình","Tất cả các đáp án"]],["Theo Quyết định số 749/QĐ-TTg ngày 03/6/2020 của Thủ tướng Chính phủ, mục tiêu cơ bản đến năm 2025 trong Chương trình chuyển đổi số Quốc gia đến năm 2025, định hướng đến năm 2030 đặt ra mục tiêu Việt Nam thuộc nhóm bao nhiêu nước dẫn đầ var TONG = NHOM.reduce(function(s,n){return s+n.lay},0);
var NGUONG = 28;
var KEY = 'bdhvs_lichsu_v1';

/* phương án kiểu "Tất cả đều đúng" phải ghim xuống cuối khi trộn */
var RE_CUOI = /(tất cả|cả a và|cả hai|cả ba|cả 2|cả 3|đều đúng|đều sai|các ý trên|các đáp án trên|các phương án trên|không có đáp án|đáp án khác|a và b|a, b)/i;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;';})}
function tron(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t}return a}
function hai(n){return n<10?'0'+n:''+n}
function ngayGio(t){var d=new Date(t);
  return hai(d.getDate())+'/'+hai(d.getMonth()+1)+'/'+d.getFullYear()+' '+hai(d.getHours())+':'+hai(d.getMinutes())}
function phutGiay(s){return Math.floor(s/60)+':'+hai(s%60)}
function diem10(dung){return (dung/TONG*10).toFixed(1).replace('.',',')}

/* bốc đề */
function bocDe(){
  var de=[];
  for(var g=0;g<NHOM.length;g++){
    var n=NHOM[g];
    var tatCa=[]; for(var t=0;t<n.q.length;t++)tatCa.push(t);
    var idx=tron(tatCa).slice(0,n.lay);
    for(var k=0;k<idx.length;k++){
      var opts=n.q[idx[k]][2], thuong=[], cuoi=[];
      for(var o=0;o<opts.length;o++){ if(RE_CUOI.test(opts[o]))cuoi.push(o); else thuong.push(o); }
      de.push({g:g,i:idx[k],ord:tron(thuong).concat(cuoi),chon:[]});
    }
  }
  return de;
}
function cauCua(c){return NHOM[c.g].q[c.i]}
function dungKhong(c){
  var dap=cauCua(c)[1];
  if(c.chon.length!==dap.length)return false;
  for(var i=0;i<dap.length;i++)if(c.chon.indexOf(dap[i])<0)return false;
  return true;
}

  h+='</div><div class="noidung">'+esc(q[0])+'</div><div class="pa">';
  for(var k=0;k<c.ord.length;k++){
    var oi=c.ord[k], daChon=c.chon.indexOf(oi)>=0, laDap=dap.indexOf(oi)>=0, cls='', dau='';
    if(hienKq){
      if(laDap){cls=' d';dau='<span class="dau d">&#10004;</span>';}
      else if(daChon){cls=' s';dau='<span class="dau s">&#10008;</span>';}
      else dau='<span class="dau"></span>';
    }
    h+='<label class="pa-item'+(daChon?' chon':'')+cls+'">';
    if(hienKq)h+=dau+'<input type="'+(nhieu?'checkbox':'radio')+'" disabled'+(daChon?' checked':'')+'>';
    else h+='<input type="'+(nhieu?'checkbox':'radio')+'" name="'+pre+so+'"'+(daChon?' checked':'')+
            ' onchange="chonPA('+(so-1)+','+oi+',this.checked)">';
    h+='<span>'+esc(q[2][oi])+'</span></label>';
  }
  return h+'</div></div>';
}

/* màn làm bài */
function veBai(){
  var h='';
  for(var i=0;i<de.length;i++)h+=veCau(de[i],i+1,daNop,'c');
  document.getElementById('dsCau').innerHTML=h;
  veThanh(); veO();
}
function veThanh(){
  var el=document.getElementById('thanhBai');
  if(daNop){
    var d=0; for(var i=0;i<de.length;i++)if(dungKhong(de[i]))d++;
    var dat=d>=NGUONG;
    el.innerHTML='<div class="kq">'+(dat?'&#10004;':'&#10008;')+' '+d+'/'+TONG+' câu đúng &middot; <span class="diem">'+
      diem10(d)+' điểm</span> &middot; <span class="'+(dat?'dat':'chuadat')+'">'+(dat?'ĐẠT':'CHƯA ĐẠT')+
      '</span> &middot; '+phutGiay(giayDung)+'</div>'+
      '<button class="nut nut-c" onclick="baiMoi()">Làm bài mới</button>';
  }else{
    var n=0; for(var j=0;j<de.length;j++)if(de[j].chon.length)n++;
    el.innerHTML='<span class="dem">Đã làm '+n+'/'+TONG+'</span>'+
      '<div class="tiendo"><i style="width:'+(n/TONG*100)+'%"></i></div>'+
      '<span class="dem" id="dongHo">0:00</span>'+
      '<button class="nut nut-c" onclick="nopBai()">Nộp bài</button>';
  }
}
function veO(){
  var h='';
  for(var i=0;i<de.length;i++){
    var cls='';
    if(daNop)cls=dungKhong(de[i])?' d':' s';
    else if(de[i].chon.length)cls=' lam';
    h+='<button class="o'+cls+'" onclick="toiCau('+(i+1)+')">'+(i+1)+'</button>';
  }
  document.getElementById('oLuoi').innerHTML=h;
  document.getElementById('chuThich').innerHTML = daNop
    ? '<span class="cham" style="background:#e7f6ec;border-color:#15803d"></span>Đúng<br>'+
      '<span class="cham" style="background:#fdeceb;border-color:#c0392b"></span>Sai'
    : '<span class="cham"></span>Chưa làm<br>'+
      '<span class="cham" style="background:#e8f1fa;border-color:#1a6fbf"></span>Đã chọn';
}
function toiCau(so){
  var el=document.getElementById('c'+so);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
}
function chonPA(ci,oi,bat){
  var c=de[ci], nhieu=cauCua(c)[1].length>1;
  if(nhieu){
    var p=c.chon.indexOf(oi);
    if(bat&&p<0)c.chon.push(oi); else if(!bat&&p>=0)c.chon.splice(p,1);
  }else c.chon=[oi];
  var lb=document.getElementById('c'+(ci+1)).querySelectorAll('.pa-item');
  for(var k=0;k<lb.length;k++){
    var o=c.ord[k], co=c.chon.indexOf(o)>=0;
    lb[k].className='pa-item'+(co?' chon':'');
    lb[k].querySelector('input').checked=co;
  }
  veThanh(); veO();
}
function nopBai(){
  var chua=0; for(var i=0;i<de.length;i++)if(!de[i].chon.length)chua++;
  if(chua && !confirm('Còn '+chua+' câu chưa làm. Vẫn nộp bài?'))return;
  daNop=true; giayDung=Math.round((Date.now()-batDau)/1000);
  luu();
  veBai();
  window.scrollTo({top:0,behavior:'smooth'});
}
function baiMoi(){
  de=bocDe(); daNop=false; batDau=Date.now(); giayDung=0;
  veBai();
  window.scrollTo({top:0});
}

/* lịch sử */
function docLS(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function luu(){
  var ls=docLS(), d=0;
  for(var i=0;i<de.length;i++)if(dungKhong(de[i]))d++;
  ls.push({t:Date.now(),d:d,s:giayDung,
    c:de.map(function(c){return[c.g,c.i,c.ord,c.chon]})});
  if(ls.length>200)ls=ls.slice(-200);
  try{localStorage.setItem(KEY,JSON.stringify(ls))}catch(e){}
}
function veTK(){
  var ls=docLS(), el=document.getElementById('tkBang');
  if(!ls.length){el.innerHTML='<div class="hop rong">Chưa có bài nào. Hãy làm bài ở tab <b>Làm bài thi</b>.</div>';return}
  var dat=0,cao=0,tong=0;
  for(var i=0;i<ls.length;i++){ if(ls[i].d>=NGUONG)dat++; if(ls[i].d>cao)cao=ls[i].d; tong+=ls[i].d; }
  var h='<div class="tomtat">'+
    '<div class="the"><b>'+ls.length+'</b><span>lượt làm</span></div>'+
    '<div class="the"><b style="color:#15803d">'+dat+'</b><span>đạt</span></div>'+
    '<div class="the"><b style="color:#c0392b">'+(ls.length-dat)+'</b><span>chưa đạt</span></div>'+
    '<div class="the"><b>'+cao+'/'+TONG+'</b><span>cao nhất</span></div>'+
    '<div class="the"><b>'+(tong/ls.length).toFixed(1).replace('.',',')+'</b><span>trung bình (câu đúng)</span></div>'+
    '</div><div class="hop" style="padding:0;overflow:hidden">'+
    '<table><thead><tr><th class="c-stt">STT</th><th class="c-ngay">Ngày</th>'+
    '<th class="c-diem">Điểm</th><th class="c-gio">Thời gian</th><th>Đánh giá</th></tr></thead><tbody>';
  for(var k=ls.length-1;k>=0;k--){
    var r=ls[k], ok=r.d>=NGUONG;
    h+='<tr onclick="xemLai('+k+')" title="Bấm để xem lại bài làm">'+
      '<td class="c-stt">'+(k+1)+'</td><td class="c-ngay">'+ngayGio(r.t)+'</td>'+
      '<td class="c-diem">'+r.d+'/'+TONG+' &middot; '+diem10(r.d)+'</td>'+
      '<td class="c-gio">'+phutGiay(r.s||0)+'</td>'+
      '<td class="bd '+(ok?'dat':'chuadat')+'">'+(ok?'&#9679; Đạt':'&#9675; Chưa đạt')+'</td></tr>';
  }
  el.innerHTML=h+'</tbody></table></div>';
}
function xemLai(i){
  var r=docLS()[i]; if(!r)return;
  var ds=r.c.map(function(x){return{g:x[0],i:x[1],ord:x[2],chon:x[3]}});
  var ok=r.d>=NGUONG, h='';
  for(var k=0;k<ds.length;k++)h+=veCau(ds[k],k+1,true,'x');
  document.getElementById('xemCau').innerHTML=h;
  document.getElementById('xemKq').innerHTML='Lượt '+(i+1)+' &middot; '+ngayGio(r.t)+' &middot; '+
    r.d+'/'+TONG+' câu đúng &middot; <span class="diem">'+diem10(r.d)+' điểm</span> &middot; '+
    '<span class="'+(ok?'dat':'chuadat')+'">'+(ok?'ĐẠT':'CHƯA ĐẠT')+'</span>';
  document.getElementById('tkBang').className='tk an';
  document.getElementById('tkXem').className='tk';
  window.scrollTo({top:0});
}
document.getElementById('btVe').onclick=function(){
  document.getElementById('tkXem').className='tk an';
  document.getElementById('tkBang').className='tk';
};

/* tab */
function doiTab(k){
  document.getElementById('tabBtn0').className='tab'+(k===0?' on':'');
  document.getElementById('tabBtn1').className='tab'+(k===1?' on':'');
  document.getElementById('man0').className=k===0?'':'an';
  document.getElementById('man1').className=k===1?'':'an';
  if(k===1){
    document.getElementById('tkXem').className='tk an';
    document.getElementById('tkBang').className='tk';
    veTK();
  }
  window.scrollTo({top:0});
}
document.getElementById('tabBtn0').onclick=function(){doiTab(0)};
document.getElementById('tabBtn1').onclick=function(){doiTab(1)};
document.getElementById('btMoi').onclick=function(){
  var coLam=false;
  for(var i=0;i<de.length;i++)if(de[i].chon.length){coLam=true;break}
  if(!daNop && coLam && !confirm('Bỏ bài đang làm và bốc đề mới?'))return;
  baiMoi();
};

/* đồng hồ */
setInterval(function(){
  if(daNop)return;
  var el=document.getElementById('dongHo');
  if(el)el.textContent=phutGiay(Math.round((Date.now()-batDau)/1000));
},1000);

baiMoi();
</script>
</body>
</html>
