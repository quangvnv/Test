<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Bình dân học vụ số</title>
<style>
:root{
  --nen:#fff; --chu:#1a1a1a; --mo:#6b7280; --vien:#e5e7eb; --nennhe:#f7f8fa;
  --xanh:#1a6fbf; --xanhnhe:#e8f1fa; --dung:#15803d; --dungnhe:#e7f6ec;
  --sai:#c0392b; --sainhe:#fdeceb; --cam:#d4740a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--nennhe);color:var(--chu);font:16px/1.5 "Segoe UI",system-ui,Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}

/* thanh tiêu đề + tab */
.top{background:var(--nen);border-bottom:1px solid var(--vien);position:sticky;top:0;z-index:20}
.top-in{max-width:1180px;margin:0 auto;padding:10px;display:flex;align-items:center;gap:10px}
.ten{font-weight:600;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:6px;flex:none}
.tab{border:1px solid var(--vien);background:var(--nen);color:var(--chu);border-radius:18px;padding:6px 14px;font-size:15px}
.tab.on{background:var(--xanh);border-color:var(--xanh);color:#fff}

/* thanh tiến độ / kết quả */
.thanh{background:var(--nen);border-bottom:1px solid var(--vien);position:sticky;top:53px;z-index:15}
.thanh-in{max-width:1180px;margin:0 auto;padding:8px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tiendo{flex:1;min-width:120px;height:6px;background:var(--vien);border-radius:3px;overflow:hidden}
.tiendo>i{display:block;height:100%;background:var(--xanh);width:0;transition:width .2s}
.dem{font-size:14px;color:var(--mo);white-space:nowrap}
.nut{border:1px solid var(--vien);background:var(--nen);color:var(--chu);border-radius:6px;padding:7px 14px;font-size:15px}
.nut:hover{background:var(--nennhe)}
.nut-c{background:var(--xanh);border-color:var(--xanh);color:#fff}
.nut-c:hover{background:#155a9c}
.kq{font-weight:600;flex:1;min-width:180px}
.kq .diem{color:var(--xanh)}
.kq .dat{color:var(--dung)} .kq .chuadat{color:var(--sai)}

/* bố cục */
.khung{max-width:1180px;margin:0 auto;padding:10px;display:flex;gap:10px;align-items:flex-start}
.cot-cau{flex:1;min-width:0}
.cot-o{flex:0 0 210px;position:sticky;top:110px}
.hop{background:var(--nen);border:1px solid var(--vien);border-radius:8px;padding:10px}
.o-luoi{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.o{border:1px solid var(--vien);background:var(--nen);border-radius:6px;padding:7px 0;font-size:14px;text-align:center}
.o.lam{background:var(--xanhnhe);border-color:var(--xanh);color:var(--xanh);font-weight:600}
.o.d{background:var(--dungnhe);border-color:var(--dung);color:var(--dung);font-weight:600}
.o.s{background:var(--sainhe);border-color:var(--sai);color:var(--sai);font-weight:600}
.chuthich{font-size:13px;color:var(--mo);margin-top:8px;line-height:1.7}
.cham{display:inline-block;width:10px;height:10px;border-radius:2px;border:1px solid var(--vien);vertical-align:-1px;margin-right:4px}

/* thẻ câu hỏi */
.cau{background:var(--nen);border:1px solid var(--vien);border-radius:8px;padding:12px;margin-bottom:10px;scroll-margin-top:118px}
.cau-dau{display:flex;gap:8px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
.stt{font-weight:600;font-size:15px}
.nhan{font-size:12px;color:var(--mo)}
.nhan.nhieu{color:var(--cam)}
.noidung{margin-bottom:10px}
.pa{display:flex;flex-direction:column;gap:6px}
.pa-item{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--vien);border-radius:6px;padding:8px 10px;cursor:pointer}
.pa-item:hover{background:var(--nennhe)}
.pa-item input{margin:3px 0 0;flex:none;width:16px;height:16px;accent-color:var(--xanh)}
.pa-item.chon{background:var(--xanhnhe);border-color:var(--xanh)}
.xong .pa-item{cursor:default}
.xong .pa-item:hover{background:var(--nen)}
.xong .pa-item.chon{background:var(--nen);border-color:var(--vien)}
.pa-item.d{background:var(--dungnhe)!important;border-color:var(--dung)!important}
.pa-item.s{background:var(--sainhe)!important;border-color:var(--sai)!important}
.dau{flex:none;font-weight:700;width:16px;text-align:center}
.dau.d{color:var(--dung)} .dau.s{color:var(--sai)}

/* thống kê */
.tk{max-width:1180px;margin:0 auto;padding:10px}
.tomtat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.the{background:var(--nen);border:1px solid var(--vien);border-radius:8px;padding:10px 14px;min-width:110px}
.the b{display:block;font-size:21px;line-height:1.2}
.the span{font-size:13px;color:var(--mo)}
table{width:100%;border-collapse:collapse;background:var(--nen);table-layout:fixed}
th,td{border-bottom:1px solid var(--vien);padding:9px 10px;text-align:left;font-size:15px}
th{background:var(--nennhe);font-weight:600;font-size:14px;text-align:center}
.c-stt{width:56px;text-align:center} .c-ngay{width:170px;text-align:center}
.c-diem{width:120px;text-align:center} .c-gio{width:90px;text-align:center}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--nennhe)}
.bd{font-weight:600} .bd.dat{color:var(--dung)} .bd.chuadat{color:var(--sai)}
.rong{padding:28px 10px;text-align:center;color:var(--mo)}

.an{display:none!important}
@media (max-width:860px){
  .khung{flex-direction:column}
  .cot-o{flex:none;width:100%;position:static}
  .o-luoi{grid-template-columns:repeat(9,1fr)}
  .chuthich{display:none}
  .c-ngay{width:110px} .c-gio{display:none}
}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <div class="ten">Ôn tập Bình dân học vụ số</div>
  <div class="tabs">
    <button class="tab on" id="tabBtn0">Làm bài thi</button>
    <button class="tab" id="tabBtn1">Thống kê</button>
  </div>
</div></div>

<!-- TAB 1: LÀM BÀI -->
<div id="man0">
  <div class="thanh"><div class="thanh-in" id="thanhBai"></div></div>
  <div class="khung">
    <div class="cot-cau" id="dsCau"></div>
    <div class="cot-o"><div class="hop">
      <div class="o-luoi" id="oLuoi"></div>
      <div class="chuthich" id="chuThich"></div>
      <button class="nut" id="btMoi" style="width:100%;margin-top:8px">Làm bài mới</button>
    </div></div>
  </div>
</div>

<!-- TAB 2: THỐNG KÊ -->
<div id="man1" class="an">
  <div class="tk" id="tkBang"></div>
  <div class="tk an" id="tkXem">
    <div style="margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="nut" id="btVe">&#8592; Quay lại thống kê</button>
      <div class="kq" id="xemKq"></div>
    </div>
    <div id="xemCau"></div>
  </div>
</div>

<script>
var NHOM = [{"ten":"Kỹ năng an toàn thông tin","lay":4,"q":[["Khi cài đặt phần mềm trên máy tính, Đồng chí nên làm gì để đảm bảo an toàn?",[0],["Tải từ website chính thức hoặc cửa hàng ứng dụng uy tín.","Tải từ link chia sẻ trên mạng xã hội","Dùng bản crack để tiết kiệm chi phí.","Cài từ USB không rõ nguồn gốc"]],["Để bảo vệ dữ liệu quan trọng trong máy tính, Đồng chí nên làm gì?",[0],["Sao lưu dữ liệu định kỳ ra ổ cứng ngoài hoặc cloud.","Chỉ lưu dữ liệu trên ổ C.","Chia sẻ dữ liệu nhạy cảm qua email công cộng.","Đặt mật khẩu giống nhau cho tất cả file."]],["Mật khẩu của thiết bị di động nên đặt như thế nào để đảm bảo an toàn?",[2],["Sử dụng ngày sinh hoặc số điện thoại.","Chỉ dùng mật khẩu 4 số để dễ nhớ.","Kết hợp chữ hoa, chữ thường, số và ký tự đặc biệt.","Không cần đặt mật khẩu để tiết kiệm thời gian mở máy."]],["Vì sao nên bật tính năng cập nhật tự động của hệ điều hành?",[0],["Để nhận các bản vá bảo mật mới, ngăn chặn tấn công.","Để máy tính chậm hơn.","Để xóa phần mềm cũ.","Để quảng cáo hiển thị nhiều hơn."]],["Tại sao cần khóa màn hình bằng vân tay hoặc mật khẩu?",[3],["Để tiết kiệm pin.","Để điện thoại chạy nhanh hơn.","Để tránh bị virus xâm nhập.","Để bảo vệ dữ liệu nếu thiết bị bị mất hoặc đánh cắp."]],["Khi cắm USB lạ vào máy tính, việc đầu tiên nên làm là gì?",[1],["Mở tất cả các file để kiểm tra nội dung.","Quét virus trước khi mở","Tắt phần mềm diệt virus để tránh cảnh báo.","Sao chép toàn bộ file sang máy để “nghiên cứu”."]],["Để bảo vệ thông tin cá nhân khi bán hoặc cho mượn thiết bị, Đồng chí nên:",[3],["Để nguyên dữ liệu cho người khác sử dụng.","Chỉ xóa các ứng dụng mạng xã hội.","Chỉ đổi mật khẩu Wi-Fi.","Xóa toàn bộ dữ liệu hoặc khôi phục cài đặt gốc."]],["Khi nhận email có file đính kèm từ người lạ, Đồng chí nên:",[2],["Chia sẻ file đó cho đồng nghiệp để kiểm tra.","Tắt phần mềm bảo mật để mở nhanh hơn.","Không mở file, kiểm tra kỹ hoặc xóa email.","Tải và mở ngay để xem nội dung."]],["Vì sao nên cài phần mềm diệt virus trên thiết bị?",[1],["Để tăng tốc độ chơi game.","Để phát hiện và ngăn chặn mã độc","Để tiết kiệm dung lượng pin.","Để xóa quảng cáo trên mạng xã hội."]],["Để tránh bị mất tài khoản khi dùng thiết bị công cộng (máy ở quán net, thư viện…), Đồng chí nên:",[3],["Lưu mật khẩu vào trình duyệt để đăng nhập nhanh.","Chia sẻ tài khoản với Đồng chí bè để cùng đăng nhập.","Đăng nhập mọi tài khoản quan trọng trên máy công cộng.","Đăng xuất sau khi sử dụng và không lưu mật khẩu."]],["Một biện pháp quan trọng để bảo vệ điện thoại khi cài ứng dụng mới là gì?",[2],["Cho phép ứng dụng toàn quyền truy cập danh bạ, tin nhắn.","Tải file APK từ nguồn lạ để cài nhanh hơn.","Kiểm tra quyền truy cập mà ứng dụng yêu cầu.","Không cần kiểm tra gì vì ứng dụng nào cũng an toàn."]],["Tại sao không nên chia sẻ công khai số CMND/CCCD, số điện thoại trên mạng xã hội?",[1],["Vì mạng xã hội sẽ tự động khóa tài khoản","Vì có thể bị kẻ xấu lợi dụng để lừa đảo hoặc giả mạo danh tính.","Vì sẽ làm giảm tốc độ Internet.","Vì máy tính sẽ dễ bị virus hơn."]],["Để bảo mật quyền riêng tư khi duyệt web, Đồng chí nên:",[0],["Sử dụng chế độ duyệt web ẩn danh hoặc xóa lịch sử thường xuyên.","Chia sẻ lịch sử duyệt web cho Đồng chí bè.","Luôn đăng nhập mọi tài khoản trên máy công cộng.","Cho phép tất cả website lưu cookie vô thời hạn."]],["Một cách hiệu quả để giảm nguy cơ bị đánh cắp tài khoản cá nhân là:",[1],["Sử dụng mật khẩu ngắn và dễ nhớ.","Bật xác thực hai yếu tố (2FA).","Dùng chung mật khẩu cho nhiều tài khoản.","Ghi mật khẩu lên tường để khỏi quên."]],["Khi nhận được yêu cầu cung cấp thông tin cá nhân từ email lạ, Đồng chí nên làm gì?",[2],["Gửi ngay toàn bộ thông tin để tránh bị mất cơ hội.","Chia sẻ email cho Đồng chí bè để cùng trả lời.","Không cung cấp và xác minh tính hợp pháp trước.","Cung cấp số tài khoản và mật khẩu ngân hàng."]],["Để tránh bị rò rỉ dữ liệu khi sử dụng Wi-Fi công cộng, Đồng chí nên:",[0],["Sử dụng VPN để mã hóa kết nối.","Đăng nhập vào tất cả tài khoản quan trọng.","Tắt phần mềm bảo mật để tăng tốc độ.","Cho phép mọi người cùng kết nối thiết bị của Đồng chí."]],["Một trong những rủi ro khi sử dụng ứng dụng miễn phí không rõ nguồn gốc là gì?",[0],["Bị thu thập và bán dữ liệu cá nhân.","Được tăng dung lượng bộ nhớ miễn phí.","Máy chạy nhanh hơn.","Được hỗ trợ kỹ thuật chính hãng."]],["Để hạn chế việc bị theo dõi trực tuyến, Đồng chí nên:",[3],["Cho phép tất cả cookie mà không cần hỏi.","Luôn bật chia sẻ vị trí cho mọi ứng dụng.","Công khai danh bạ và tin nhắn.","Từ chối hoặc tùy chỉnh quyền cookie và theo dõi quảng cáo."]],["Vì sao không nên chia sẻ mật khẩu cho người khác?",[2],["Vì làm mạng xã hội khóa tài khoản.","Vì làm giảm dung lượng lưu trữ.","Vì có thể bị truy cập trái phép và mất quyền kiểm soát tài khoản.","Vì khiến máy tính chạy chậm."]],["Để bảo vệ quyền riêng tư khi tham gia mạng xã hội, Đồng chí nên:",[2],["Công khai toàn bộ bài viết và thông tin nhạy cảm.","Kết Đồng chí với tất cả người lạ để có nhiều “follower”.","Cài đặt chế độ chỉ Đồng chí bè mới xem được thông tin cá nhân.","Chia sẻ mật khẩu để Đồng chí bè cùng quản lý."]],["Một biện pháp quan trọng để bảo vệ dữ liệu cá nhân khi bị mất điện thoại là:",[1],["Tắt mọi tính năng bảo mật để tiết kiệm pin.","Bật tính năng định vị và xóa dữ liệu từ xa.","Lưu tất cả mật khẩu trong tin nhắn SMS."]],["Thói quen ăn uống nào giúp bảo vệ sức khỏe thể chất?",[0],["Ăn uống cân bằng, nhiều rau xanh và trái cây.","Chỉ ăn mì gói cho nhanh.","Bỏ bữa thường xuyên để giảm cân.","Ăn toàn đồ chiên rán, uống nước ngọt có ga."]],["Để tránh lộ lọt bí mật quân sự khi làm việc trực tuyến, cần thực hiện biện pháp nào?",[0],["Sử dụng phần mềm bảo mật, mã hóa dữ liệu khi truyền tải.","Dùng Wi-Fi công cộng miễn phí để tiết kiệm chi phí.","Lưu tài liệu mật trên USB không có mật khẩu.","Gửi tài liệu mật qua mạng xã hội cá nhân."]],["Khi nhận được email lạ yêu cầu cung cấp thông tin quân sự, cần làm gì?",[1],["Trả lời ngay để tránh mất thời gian.","Báo cáo cho cấp trên và bộ phận an ninh mạng.","Chuyển tiếp email cho đồng đội để tham khảo.","Lưu file đính kèm để kiểm tra nội dung."]],["Một trong những nguy cơ làm lộ bí mật quân sự là gì?",[0],["Chia sẻ hình ảnh, vị trí doanh trại lên mạng xã hội.","Sao lưu dữ liệu mật bằng giấy in bảo mật.","Chỉ lưu tài liệu trên máy tính nội bộ có bảo vệ.","Thực hiện họp kín trong phòng cách âm."]],["Để bảo vệ thông tin liên lạc quân sự, biện pháp nào sau đây là đúng?",[3],["Trao đổi mật khẩu qua điện thoại cá nhân.","Ghi chép thông tin mật vào ứng dụng ghi chú online.","Chia sẻ qua nhóm chat công khai để dễ dàng truy cập.","Sử dụng kênh liên lạc mã hóa và có xác thực."]],["Khi phát hiện thiết bị lưu trữ chứa thông tin mật bị mất, cần làm gì trước tiên?",[1],["Xóa toàn bộ dữ liệu trong máy tính cá nhân.","Báo cáo ngay cho cơ quan chức năng để xử lý.","Đợi vài ngày xem có ai trả lại hay không.","Tự ý đăng tin tìm đồ lên mạng xã hội."]],["Biện pháp nào sau đây giúp hạn chế rủi ro rò rỉ dữ liệu quân sự từ thiết bị cá nhân?",[3],["Dùng chung tài khoản email cá nhân và công việc.","Tải ứng dụng không rõ nguồn gốc về thiết bị.","Cho mượn thiết bị lưu trữ thông tin mật.","Cập nhật phần mềm bảo mật và hệ điều hành thường xuyên."]],["Vì sao không nên sử dụng USB, ổ cứng lạ trong môi trường quân sự?",[2],["Không tương thích với máy in quân sự.","Ổ cứng ngoài tốn điện năng.","Có thể chứa mã độc và gây rò rỉ thông tin mật.","USB làm máy tính chậm hơn."]],["Biện pháp nào đúng để bảo vệ thông tin mật khi hội họp?",[0],["Đảm bảo phòng họp cách âm, kiểm soát thiết bị ghi âm.","Cho phép dùng điện thoại trong suốt cuộc họp.","Ghi âm cuộc họp để chia sẻ cho mọi người dễ nhớ.","Mời khách ngoài đơn vị tham dự để tăng minh bạch."]],["Trong công tác quân sự, khi sử dụng mạng xã hội cần chú ý gì?",[2],["Thường xuyên đăng ảnh doanh trại để lưu kỷ niệm.","Kết Đồng chí bừa bãi để mở rộng mối quan hệ.","Không tiết lộ thông tin về vị trí, nhiệm vụ, trang bị.","Dùng tài khoản chung để dễ quản lý."]],["Để kiểm soát truy cập vào tài liệu mật, biện pháp nào là đúng?",[1],["Đặt mật khẩu đơn giản để mọi người dễ nhớ.","Phân quyền chặt chẽ, chỉ cho người có thẩm quyền truy cập","Lưu tài liệu vào thư mục chung trên mạng nội bộ mở.","Chia sẻ tài liệu mật qua email cá nhân."]],["Để đảm bảo an toàn thông tin quân sự trên thiết bị di động, cần làm gì?",[3],["Lưu toàn bộ tài liệu mật trên ứng dụng đám mây cá nhân.","Cho người ngoài mượn điện thoại tùy ý.","Để máy luôn mở khóa để tiện sử dụng.","Cài mật khẩu mạnh và bật xác thực hai yếu tố."]],["Nguyên tắc cốt lõi của lập trình an toàn là gì?",[1],["Tăng tốc độ phát triển phần mềm.","Ngăn chặn các lỗ hổng bảo mật ngay từ giai đoạn thiết kế và phát triển.","Giảm chi phí phát triển bằng cách bỏ qua các bước kiểm thử bảo mật.","Ưu tiên tính năng mới hơn là bảo mật."]],["Lỗ hổng SQL Injection xảy ra khi nào?",[2],["Khi mã nguồn không được mã hóa.","Khi người dùng nhập mật khẩu sai nhiều lần.","Khi ứng dụng sử dụng dữ liệu đầu vào không được kiểm tra để tạo truy vấn SQL.","Khi server bị quá tải."]],["Giải pháp nào hiệu quả nhất để ngăn chặn SQL Injection?",[0],["Sử dụng Prepared Statements (hoặc tham số hóa truy vấn).","Tắt firewall của server.","Thêm nhiều lớp tường lửa.","Dùng các câu lệnh SQL viết tay."]],["Tấn công XSS (Cross-Site Scripting) là gì?",[3],["Tấn công từ chối dịch vụ.","Tấn công bằng cách tràn bộ đệm.","Tấn công bằng cách giả mạo yêu cầu từ phía người dùng.","Tấn công bằng cách chèn các đoạn mã độc vào trang web."]],["Để chống lại XSS, lập trình viên cần làm gì?",[2],["Không sử dụng JavaScript.","Mã hóa tất cả dữ liệu người dùng.","Thực hiện kiểm tra và lọc dữ liệu đầu vào, mã hóa dữ liệu đầu ra.","Chỉ cho phép người dùng đăng nhập bằng tài khoản quản trị."]],["Lỗ hổng tràn bộ đệm (Buffer Overflow) thường xảy ra trong ngôn ngữ lập trình nào?",[1],["Python và Java.","C và C++.","HTML và CSS.","JavaScript và PHP."]],["Mục tiêu của việc mã hóa dữ liệu là gì?",[3],["Giảm kích thước file.","Tăng tốc độ truyền dữ liệu.","Giúp dữ liệu dễ dàng đọc hơn.","Bảo vệ tính bí mật của dữ liệu."]],["Khi lưu trữ mật khẩu, phương pháp nào được khuyến cáo sử dụng?",[0],["Sử dụng băm (hashing) kèm \"muối\" (salt).","Lưu mật khẩu dưới dạng văn bản thuần (plain text).","Mã hóa mật khẩu bằng Base64.","Lưu mật khẩu kèm tên người dùng trong file text."]],["Nguyên tắc \"ít đặc quyền nhất\" (Principle of Least Privilege) trong lập trình an toàn có nghĩa là gì?",[2],["Mọi người dùng đều có quyền hạn như nhau.","Cấp quyền truy cập đầy đủ cho tất cả người dùng.","Chỉ cấp cho một tiến trình hoặc người dùng những quyền hạn tối thiểu cần thiết để hoàn thành công việc.","Không cấp bất kỳ quyền nào cho người dùng."]],["Để đảm bảo an toàn cho các tệp được tải lên server, lập trình viên nên làm gì?",[1],["Cho phép tải lên mọi loại tệp.","Kiểm tra phần mở rộng và nội dung của tệp để xác thực.","Lưu tệp vào thư mục gốc của trang web.","Không cần kiểm tra gì cả."]],["Mã hóa HTTPS (SSL/TLS) có vai trò gì trong lập trình an toàn?",[3],["Chống lại tấn công SQL Injection.","Bảo vệ dữ liệu trong cơ sở dữ liệu.","Ngăn chặn tấn công XSS.","Mã hóa dữ liệu truyền giữa trình duyệt và server."]],["Tấn công CSRF (Cross-Site Request Forgery) là gì?",[0],["Kẻ tấn công lừa người dùng thực hiện một hành động không mong muốn trên một trang web mà họ đã đăng nhập.","Tấn công để lấy cắp mật khẩu từ cơ sở dữ liệu.","Tấn công làm tràn bộ đệm.","Tấn công từ chối dịch vụ."]],["Biện pháp nào giúp phòng chống tấn công CSRF hiệu quả?",[1],["Kiểm tra định dạng email.","Sử dụng token CSRF ngẫu nhiên và duy nhất cho mỗi phiên.","Lọc tất cả dữ liệu đầu vào của người dùng.","Dùng tường lửa."]],["Vai trò của việc kiểm thử bảo mật mã nguồn (SAST) trong quy trình phát triển phần mềm an toàn là gì?",[2],["Phát hiện lỗi logic.","Kiểm tra hiệu suất của ứng dụng.","Tự động phân tích mã nguồn để tìm ra các lỗ hổng tiềm ẩn.","Kiểm tra giao diện người dùng."]],["Tại sao cần phải cập nhật thư viện và framework thường xuyên?",[3],["Để có thêm tính năng mới.","Để tăng tốc độ load trang.","Không cần thiết.","Để vá các lỗ hổng bảo mật đã được phát hiện."]],["An toàn lập trình trong môi trường quân đội đặc biệt quan trọng vì lý do gì?",[0],["Bảo vệ thông tin quân sự nhạy cảm và hệ thống chỉ huy, điều hành.","Giúp tiết kiệm chi phí.","Tăng số lượng người dùng.","Cải thiện giao diện người dùng."]],["Khi phát triển một ứng dụng quân sự, yếu tố bảo mật nào cần được ưu tiên hàng đầu?",[1],["Tốc độ tải ứng dụng.","Bảo mật dữ liệu và xác thực người dùng chặt chẽ.","Thiết kế giao diện đẹp mắt.","Khả năng tương thích với nhiều thiết bị."]],["Tấn công \"giả mạo\" (phishing) thường nhắm vào yếu tố nào?",[2],["Lỗ hổng phần mềm.","Lỗ hổng phần cứng.","Yếu tố con người (lừa đảo để lấy thông tin).","Lỗ hổng mạng."]],["Để bảo vệ các file nhạy cảm trên server, lập trình viên nên đặt chúng ở đâu?",[3],["Trong thư mục có thể truy cập công khai.","Trong thư mục gốc của web.","Dùng tên file dễ đoán.","Ngoài thư mục gốc của web (root directory) để không thể truy cập trực tiếp từ trình duyệt."]],["Lỗi logic trong lập trình có thể dẫn đến hậu quả gì về bảo mật?",[0],["Người dùng có thể bỏ qua bước xác thực hoặc truy cập dữ liệu trái phép.","Ứng dụng chạy chậm hơn.","Giao diện không hiển thị đúng.","Tốn nhiều tài nguyên hơn."]],["Tấn công \"tràn số nguyên\" (Integer Overflow) xảy ra khi nào?",[3],["Khi sử dụng số thực trong tính toán.","Khi sử dụng số âm.","Khi dữ liệu quá lớn so với bộ nhớ.","Khi kết quả của một phép toán số học vượt quá giới hạn của kiểu dữ liệu được sử dụng."]],["Tại sao việc kiểm tra đầu vào (input validation) là cần thiết?",[1],["Để giảm dung lượng dữ liệu.","Để ngăn chặn các dữ liệu độc hại hoặc không hợp lệ được xử lý bởi ứng dụng.","Để tăng tốc độ xử lý dữ liệu.","Không có lý do cụ thể."]],["Để bảo vệ session của người dùng, lập trình viên cần làm gì?",[0],["Sử dụng cookie an toàn (Secure flag) và thời gian sống ngắn.","Lưu session ID trong URL.","Lưu session ID dưới dạng văn bản thuần.","Tắt session."]],["Sự khác biệt giữa mã hóa (encryption) và băm (hashing) là gì?",[2],["Mã hóa có thể đảo ngược, băm không thể.","Mã hóa không cần khóa, băm cần khóa.","Mã hóa có thể giải mã để lấy lại dữ liệu gốc, băm là quá trình một chiều không thể đảo ngược.","Không có sự khác biệt."]],["Khi phát triển phần mềm cho hệ thống quân sự, việc tuân thủ các quy định, tiêu chuẩn an ninh mạng là:",[3],["Không cần thiết.","Chỉ là một lựa chọn.","Chỉ cần tuân thủ một phần.","Bắt buộc và mang tính sống còn."]],["Tấn công \"mật mã\" (cryptographic attack) là gì?",[1],["Tấn công vào hệ thống không sử dụng mã hóa.","Tấn công nhằm tìm ra lỗ hổng trong các thuật toán mã hóa, khóa mã hoặc cách sử dụng chúng.","Tấn công để lấy cắp mật khẩu từ người dùng.","Tấn công vào hệ thống mạng."]],["Kiểm soát truy cập (Access Control) trong lập trình an toàn nhằm mục đích gì?",[2],["Chỉ cho phép người dùng vào ứng dụng.","Cho phép mọi người dùng truy cập mọi tính năng.","Đảm bảo người dùng chỉ có thể truy cập vào các tài nguyên và chức năng mà họ có quyền.","Không giới hạn quyền truy cập."]],["Vòng đời phát triển phần mềm an toàn (SDLC - Security Development Lifecycle) là gì?",[0],["Một quy trình tích hợp các hoạt động bảo mật vào tất cả các giai đoạn của vòng đời phát triển phần mềm.","Một quy trình chỉ tập trung vào kiểm thử bảo mật sau khi phát triển xong.","Một quy trình chỉ dành cho các phần mềm quân sự.","Một quy trình chỉ tập trung vào thiết kế giao diện."]],["Tại sao việc logging (ghi nhật ký) các hoạt động quan trọng lại cần thiết trong một ứng dụng?",[3],["Không có lợi ích gì.","Chỉ để xem ứng dụng có chạy hay không.","Để tăng tốc độ ứng dụng.","Để phát hiện và phân tích các hành vi đáng ngờ hoặc tấn công tiềm ẩn."]],["Một trong những nguyên tắc quan trọng nhất khi xử lý dữ liệu nhạy cảm là gì?",[1],["Lưu trữ dữ liệu dưới dạng văn bản thuần để dễ truy cập.","Mã hóa dữ liệu cả khi lưu trữ và khi truyền đi.","Chỉ mã hóa dữ liệu khi lưu trữ.","Không cần mã hóa nếu hệ thống được bảo vệ bằng tường lửa."]],["Mục tiêu chính của giám sát mạng trong bối cảnh chuyển đổi số là gì?",[1],["Tăng tốc độ kết nối Internet.","Đảm bảo tính sẵn sàng, hiệu suất và an toàn của hệ thống mạng.","Giảm chi phí mua sắm thiết bị.","Giảm số lượng nhân viên IT."]],["Hệ thống giám sát mạng nào được sử dụng để phát hiện các mối đe dọa bảo mật?",[2],["Hệ thống quản lý tài liệu.","Hệ thống quản lý nhân sự.","Hệ thống phát hiện và ngăn chặn xâm nhập (IDS/IPS).","Hệ thống quản lý kho bãi."]],["Giám sát chủ động (Active Monitoring) là gì?",[0],["Gửi các gói tin để kiểm tra trạng thái và phản hồi của thiết bị mạng.","Ghi lại các sự kiện khi chúng tự xảy ra trên mạng.","Giám sát bằng cách đọc log file.","Tất cả các đáp án trên."]],["Chỉ số nào quan trọng nhất khi giám sát hiệu suất mạng?",[3],["Nhiệt độ của server.","Số lượng người dùng online.","Số lượng file được tải lên.","Độ trễ (Latency), mất gói tin (Packet Loss) và băng thông (Bandwidth)."]],["Hệ thống SIEM (Security Information and Event Management) được sử dụng để làm gì?",[1],["Quản lý tài chính.","Tập hợp và phân tích dữ liệu log từ nhiều nguồn để phát hiện mối đe dọa.","Quản lý nhân sự.","Quản lý các tài liệu giấy tờ."]],["Tại sao việc giám sát lưu lượng mạng (network traffic) lại quan trọng?",[2],["Để biết số lượng người dùng truy cập.","Để biết tốc độ gõ phím của người dùng.","Để phát hiện các hoạt động bất thường hoặc tấn công mạng.","Để giảm dung lượng dữ liệu truyền đi."]],["Giám sát thụ động (Passive Monitoring) là gì?",[0],["Ghi lại và phân tích dữ liệu lưu lượng mạng đã đi qua mà không can thiệp.","Gửi các gói tin đặc biệt để kiểm tra.","Giám sát bằng cách gọi điện thoại.","Tất cả các đáp án trên."]],["Công cụ ping được sử dụng để giám sát yếu tố nào của mạng?",[1],["Băng thông.","Độ trễ và khả năng kết nối của thiết bị.","Số lượng gói tin.","Dung lượng ổ cứng của server."]],["Khi phát hiện một sự cố bảo mật, bước đầu tiên trong quy trình phản ứng là gì?",[2],["Chờ cho sự cố tự hết.","Đăng xuất khỏi hệ thống.","Cô lập (contain) hệ thống bị ảnh hưởng để ngăn chặn sự lây lan.","Đóng tất cả các ứng dụng."]],["Tác dụng của việc ghi nhật ký (logging) trong giám sát mạng là gì?",[3],["Giảm hiệu suất mạng.","Làm cho hệ thống phức tạp hơn.","Tốn dung lượng lưu trữ.","Cung cấp bằng chứng và thông tin chi tiết để điều tra sự cố."]],["Sự khác biệt giữa IDS (Hệ thống phát hiện xâm nhập) và IPS (Hệ thống ngăn chặn xâm nhập) là gì?",[0],["IDS chỉ phát hiện và cảnh báo, IPS có thể tự động ngăn chặn cuộc tấn công.","IPS chỉ phát hiện và cảnh báo, IDS có thể ngăn chặn.","Chúng hoàn toàn giống nhau.","IDS chỉ giám sát mạng, IPS chỉ giám sát host."]],["Lợi ích của việc tự động hóa giám sát mạng là gì?",[1],["Tốn nhiều chi phí hơn.","Phát hiện và phản ứng với các sự cố nhanh hơn, giảm thiểu sai sót do con người.","Làm giảm sự cần thiết của con người.","Làm cho hệ thống dễ bị tấn công hơn."]],["Để giám sát một mạng lớn, chúng ta nên sử dụng công cụ nào?",[3],["Chỉ dùng lệnh ping.","Dùng giấy và bút.","Chỉ dùng một máy tính duy nhất.","Hệ thống Quản lý Mạng tập trung (NMS - Network Management System)."]],["Giám sát mạng có vai trò gì trong việc bảo vệ thông tin mật trong quân đội?",[0],["Phát hiện các hành vi truy cập trái phép hoặc rò rỉ dữ liệu qua mạng.","Không có vai trò gì.","Chỉ để kiểm tra tốc độ tải file.","Chỉ để kiểm tra kết nối Internet."]],["Việc giám sát hiệu suất ứng dụng (APM - Application Performance Monitoring) giúp gì cho chuyển đổi số?",[1],["Làm cho ứng dụng chạy chậm hơn.","Đảm bảo các ứng dụng số mới hoạt động ổn định và hiệu quả.","Chỉ dành cho các ứng dụng web.","Giảm số lượng người dùng."]],["Sử dụng AI và Machine Learning trong giám sát mạng mang lại lợi ích gì?",[2],["Không có lợi ích.","Tốn nhiều tài nguyên hơn.","Phát hiện các mối đe dọa mới và hành vi bất thường mà các công cụ truyền thống có thể bỏ sót.","Chỉ để trang trí cho hệ thống."]],["Tại sao cần giám sát cả các thiết bị IoT (Internet of Things) trong mạng quân đội?",[3],["Để biết thiết bị nào đang bật.","Để biết nhiệt độ của thiết bị.","Không cần giám sát các thiết bị này.","Các thiết bị IoT có thể là điểm yếu để kẻ thù xâm nhập hoặc tấn công mạng."]],["Lợi ích của việc giám sát mạng trong việc dự báo và lập kế hoạch nâng cấp hạ tầng là gì?",[0],["Giúp xác định các điểm nghẽn và nhu cầu tăng trưởng trong tương lai.","Không liên quan.","Tăng chi phí hoạt động.","Làm chậm mạng hiện tại."]],["Hệ thống giám sát nào giúp phân tích sâu các gói tin trên mạng?",[1],["Hệ thống quản lý tài chính.","Hệ thống phân tích lưu lượng mạng (Network Flow Analysis).","Hệ thống quản lý tài sản.","Hệ thống quản lý kho bãi."]],["Trong giám sát mạng, cảnh báo (alert) có vai trò gì?",[2],["Làm phiền người quản trị.","Giúp người quản trị biết hệ thống đang hoạt động bình thường.","Thông báo tức thời về một sự kiện hoặc tình trạng bất thường cần được xử lý.","Không có vai trò gì."]],["Giám sát mạng giúp gì cho việc tuân thủ các quy định và tiêu chuẩn bảo mật?",[3],["Làm cho việc tuân thủ khó khăn hơn.","Không liên quan.","Chỉ áp dụng cho các công ty tư nhân.","Cung cấp bằng chứng và dữ liệu để chứng minh việc tuân thủ."]],["Để giám sát trạng thái của máy chủ (server), chúng ta cần theo dõi những thông số nào?",[0],["CPU, RAM, dung lượng ổ cứng và nhiệt độ.","Chỉ theo dõi nhiệt độ.","Chỉ theo dõi CPU.","Chỉ theo dõi dung lượng ổ cứng."]],["Hệ thống giám sát hiệu suất mạng (NPMD) giúp xác định vấn đề gì?",[1],["Vấn đề về phần mềm.","Vấn đề về độ trễ, tắc nghẽn và chất lượng dịch vụ trên mạng.","Vấn đề về nhân sự.","Vấn đề về chi phí."]],["Giám sát mạng liên tục (24/7) có ý nghĩa gì?",[2],["Lãng phí tài nguyên.","Không cần thiết.","Đảm bảo phát hiện và phản ứng kịp thời với các sự cố bất ngờ.","Làm cho hệ thống bị quá tải."]],["Khi nào thì một cảnh báo được coi là \"false positive\"?",[3],["Khi cảnh báo đó là sự thật.","Khi cảnh báo đó được đưa ra bởi con người.","Khi cảnh báo đó được đưa ra bởi AI.","Khi hệ thống báo động về một mối đe dọa nhưng thực tế không có gì nguy hiểm."]],["Giám sát từ xa (remote monitoring) là gì?",[0],["Giám sát mạng và các thiết bị từ một vị trí địa lý khác.","Giám sát mạng từ bên trong một tòa nhà.","Giám sát mạng chỉ bằng camera.","Giám sát mạng chỉ khi cần thiết."]],["Tại sao việc tích hợp giám sát mạng và giám sát bảo mật là xu hướng tất yếu trong chuyển đổi số?",[1],["Để làm cho hệ thống phức tạp hơn.","Vì các cuộc tấn công mạng thường đi kèm với các dấu hiệu về hiệu suất mạng bất thường.","Không cần thiết phải tích hợp.","Để giảm số lượng thiết bị."]],["Mục tiêu của việc phân tích log file trong giám sát mạng là gì?",[2],["Để biết ai đã đăng nhập.","Để xóa các file không cần thiết.","Để tìm ra nguyên nhân gốc rễ của sự cố hoặc dấu vết của một cuộc tấn công.","Để làm đầy dung lượng ổ cứng."]],["Giám sát mạng hiệu quả có thể giúp tiết kiệm chi phí như thế nào?",[3],["Tăng số lượng thiết bị.","Tốn nhiều tài nguyên hơn.","Làm cho hệ thống bị chậm.","Giảm thiểu thời gian chết (downtime) và chi phí khắc phục sự cố."]],["Trong giám sát mạng, việc lập bản đồ mạng (network mapping) có vai trò gì?",[0],["Cung cấp cái nhìn tổng quan về cấu trúc và các thiết bị trong mạng, giúp dễ dàng quản lý và giám sát.","Chỉ để trang trí.","Không cần thiết trong các hệ thống lớn.","Làm cho mạng chạy chậm hơn."]],["Mật khẩu mạnh nên bao gồm những yếu tố nào sau đây?",[2],["Chỉ sử dụng chữ cái thường","Chỉ sử dụng số","Kết hợp letter hoa/thường, số và ký tự đặc biệt","Sử dụng tên cá nhân hoặc ngày sinh"]],["Phishing là gì?",[1],["Một loại cá biển sâu","Lừa đảo qua email hoặc tin nhắn để lấy thông tin cá nhân","Một phần mềm antivirus","Một phương pháp mã hóa dữ liệu"]],["Khi nhận email lạ yêu cầu click link, Đồng chí nên làm gì?",[3],["Click ngay để xem nội dung","Kiểm tra địa chỉ email gửi","Chia sẻ với Đồng chí bè","Xác nhận tính xác thực trước khi click"]],["Tại sao nên cập nhật phần mềm thường xuyên?",[0],["Để vá lỗ hổng bảo mật và cải thiện an toàn","Để thay đổi giao diện","Để tăng dung lượng lưu trữ","Để giảm tốc độ máy tính"]],["Hai yếu tố xác thực (2FA) giúp gì cho tài khoản?",[2],["Làm chậm quá trình đăng nhập","Tăng số lượng mật khẩu","Cải thiện bảo mật bằng g tin?",[1],["Lớp an ninh mạng","Lớp an ninh hệ thống","Lớp an ninh cơ quan/tổ chức","Lớp an ninh hệ điều hành và phần mềm"]],["Khác biệt cơ bản của vi rút và sâu là:",[1],["Vi rút có khả năng tự lây lan mà không cần tương tác của người dùng","Sâu có khả năng tự lây lan mà không cần tương tác của người dùng","Sâu Có khả năng phá hoại lớn lơn","Vi rút có khả năng phá hoại lớn lớn"]],["Thiết bị nào sử dụng bộ lọc và các quy tắc truy cập để kiểm soát truy cập đến các mạng riêng từ các mạng công cộng, như là Internet?",[2],["Điểm truy cập không dây","Router","Tường lửa","Switch"]],["Khác biệt cơ bản giữa tấn công DoS và DDoS là:",[0],["Phạm vi tấn công","Mức độ gây hại","Kỹ thuật tấn công","Tần suất tấn công"]],["Trong dạng tấn công vào mật khẩu dựa trên từ điển, tin tặc đánh cắp mật khẩu của người dùng bằng cách:",[1],["Tìm mật khẩu trong từ điển các mật khẩu","Thử các từ có tần suất sử dụng cao làm mật khẩu trong từ điển","Vét cận các mật khẩu có thể có","Lắng nghe trên đường truyền để đánh cắp mật khẩu"]],["Một trong các phương thức lây lan thường gặp của sâu mạng là:",[2],["Lây lan thông qua sao chép các file","Lây lan thông qua dịch vụ POP","Lây lan thông qua khả năng thực thi từ xa","Lây lan thông qua Microsoft Office"]],["Phương tiện xác thực dựa trên sinh trắc học tĩnh là gì",[2],["PIN","Điện thoại","Dấu vân tay","Giọng nói"]],["Tấn công từ chối dịch vụ (Dos - Denial of Service Attacks) là dạng tấn công có khả năng?",[1],["Gây hư hỏng phần cứng máy chủ","Cản trở người dùng hợp pháp truy nhập các tài nguyên hệ thống","Đánh cắp dữ liệu trong hệ thống","Cản trở người dùng hợp pháp truy nhập các file dữ liệu của hệ thống"]],["Mật khẩu an toàn trong thời điểm hiện tại là mật khẩu có:",[2],["Chứa các ký tự từ nhiều dạng ký tự","Khả năng chống tấn công phát lại và chứa các ký tự từ nhiều dạng ký tự","Độ dài từ 8 ký tự trở lên, gồm chữ cái hoa, thường, chữ số và ký tự đặc biệt","Độ dài lớn hơn hoặc bằng 8 ký tự"]],["Một trong các mối đe dọa an toàn thông tin thường gặp là:",[3],["Phần mềm nghe lén","Phần mềm quảng cáo","Phần mềm phá mã","Phần mềm độc hại"]],["Virus máy tính thường hoạt động bàng các nào?",[1],["Gửi email spam","Gắn vào chương trình hợp lệ","Truy cập trái phép vào tài khoản ngân hàng","Chạy mã trên trình duyệt"]],["Một trong các biện pháp có thể sử dụng để phòng chống tấn công người đứng giữa là:",[1],["Sử dụng các hệ thống IPS/IDS","Sử dụng chứng chỉ số để xác thực thông tin nhận dạng các bên","Sử dụng mã hóa để đảm bảo tính bí mật các thông điệp truyền","Sử dụng tường lửa để ngăn chặn"]],["Tấn công kiểu Social Engineering là dạng tấn công khai thác yếu tố nào sau đây trong hệ thống?",[1],["Máy trạm","Người dùng","Máy chủ","Hệ điều hành & ứng dụng"]],["Phishing là một dạng của loại tấn công sử dụng...",[3],["Kỹ thuật chèn mã","Kỹ thuật giả mạo địa chỉ IP","Kỹ thuật gây tràn bộ đệm","Kỹ thuật xã hội"]],["Các dạng phần mềm độc hại (malware) có khả năng tự nhân bản gồm:",[3],["Virus, zombie, spyware","Virus, trojan, zombie","Virus, worm, trojan","Virus, worm, zombie"]],["Một trong các cách virus thường sử dụng để lây nhiễm vào các chương trình khác là:",[3],["Ẩn mã của virus","Thay thế các chương trình","Xáo trộn mã của virus","Sửa đổi các chương trình"]],["Nghị định 13/2023/NĐ-CP của Thủ tướng Chính phủ tập trung vào điều gì?",[0],["Bảo vệ dữ liệu cá nhân.","Hợp đồng lao động","Giao dịch thương mại điện tử.","An ninh quốc gia."]],["Khi sử dụng Wi-Fi công cộng, điều nào sau đây sẽ giúp Đồng chí bảo vệ thông tin cá nhân?",[3],["Đăng nhập vào tất cả các tài khoản cá nhân.","Tải xuống các tệp tin từ nguồn không rõ ràng","Chia sẻ mật khẩu với người xung quanh.","Không thực hiện các giao dịch ngân hàng hoặc nhập thông tin quan trọng."]],["Các trang web lừa đảo thường có đặc điểm nào dưới đây?",[2],["Địa chỉ URL rõ ràng, có chữ \"https\"","Giao diện chuyên nghiệp, không có lỗi chính tả.","Địa chỉ URL lạ, có nhiều ký tự bất thường hoặc không có chứng chỉ bảo mật (SSL).","Không yêu cầu thông tin cá nhân."]],["Khi nhận được cuộc gọi tự xưng là công an hoặc toà án yêu cầu cung cấp thông tin cá nhân hoặc tài khoản trực tuyến, Đồng chí nên làm gì để tránh bị lừa đảo?",[3],["Tự xác minh danh tính và thông tin của người gọi bằng cách gọi lại vào số điện thoại chính thức của cơ quan đó hoặc liên hệ trực tiếp với cơ quan qua các kênh chính thức.","Giữ bình tĩnh và không bị đánh lừa bởi áp lực tâm lý và đe dọa.","Tuyệt đối không cung cấp thông tin cá nhân hoặc tài khoản trực tuyến cho bất kỳ ai.","Các phương án trên đều đúng."]],["Biện pháp nào sau đây là tốt nhất để bảo vệ thông tin cá nhân trực tuyến?",[2],["Lưu mật khẩu trên máy tính.","Chỉ sử dụng một mật khẩu duy nhất cho tất cả các tài khoản.","Sử dụng mật khẩu mạnh và khác nhau cho từng tài khoản.","Chia sẻ thông tin cá nhân trên mạng xã hội."]],["Đâu là phương thức tốt nhất để bảo vệ tài khoản trực tuyến của Đồng chí?",[1],["Chia sẻ mật khẩu với người thân","Sử dụng mật khẩu mạnh và thiết lập xác thực hai yếu tố (2FA)","Không cần mật khẩu","Sử dụng mật khẩu đơn giản, dễ nhớ"]],["Với hình thức lừa đảo giả danh Công an gọi điện lừa người dân cập nhật căn cước công dân, các đối tượng sử dụng phương thức thủ đoạn nào?",[3],["Thông báo người dân cần cập nhật thông tin CCCD do bị lỗi hoặc chưa đồng bộ,…","Thông qua mã độc được tải song song về điện thoại, cho phép đối tượng truy cập tất cả các quyền trên điện thoại, từ đó chiếm quyền điều khiển điện thoại và chiếm đoạt tài sản.","Yêu cầu kết Đồng chí Zalo, gửi link và hướng dẫn tải ứng dụng Dịch vụ công giả mạo.","Các phương án trên đều đúng."]],["Khi phát hiện bị tấn công bằng mã độc hoặc phần mềm gián điệp, Đồng chí nên làm gì?",[3],["Xóa dữ liệu bị tấn công","Tiếp tục sử dụng thiết bị bình thường.","Tìm kiếm thông tin trên mạng xã hội.","Ngắt kết nối Internet, cài đặt phần mềm chống virus và quét toàn bộ hệ thống."]],["Khi gặp phải trang web yêu cầu Đồng chí nhập thông tin thẻ tín dụng mà không có dấu hiệu của bảo mật \"https\" trên thanh địa chỉ, Đồng chí nên:",[2],["Đặt mua hàng bằng phương thức thanh toán khác.","Tiếp tục nhập thông tin vì trang web có thể đang cập nhật chứng chỉ bảo mật.","Đóng trang web ngay lập tức và không nhập bất kỳ thông tin nào.","Liên hệ với người quản trị trang web để xác nhận."]],["Khi nhận được email yêu cầu xác nhận thông tin cá nhân, Đồng chí nên làm gì?",[1],["Gửi email trả lời để yêu cầu thêm thông tin.","Kiểm tra địa chỉ email người gửi và không nhấp vào liên kết hoặc tải về tệp đính kèm từ email không rõ nguồn gốc","Mở email ngay lập tức và cung cấp thông tin.","Không mở email và xóa ngay."]],["Phần mềm chống virus có tác dụng gì trong việc bảo vệ an toàn trực tuyến?",[1],["Giúp máy tính hoạt động nhanh hơn.","Bảo vệ thiết bị khỏi các mối đe dọa như virus, phần mềm độc hại.","Giảm hóa đơn tiền điện.","Tự động tìm kiếm thông tin trên internet."]],["Đâu là dấu hiệu cho thấy tài khoản trực tuyến của Đồng chí có thể đã bị xâm nhập?",[3],["Đồng chí nhận được email thông báo đăng nhập từ một địa chỉ IP lạ.","Các thông tin cá nhân bị thay đổi mà Đồng chí không biết.","Đồng chí không thể đăng nhập vào tài khoản.","Các phương án trên đều đúng."]],["Xác thực hai bước là gì?",[0],["Phương pháp bảo mật yêu cầu người dùng xác nhận danh tính qua 2 bước.","Hệ thống yêu cầu sử dụng mã PIN cố định.","Hình thức bảo mật bao gồm tên người dùng và mật khẩu.","Xác nhận đăng nhập qua email duy nhất."]],["Hiện tượng nào sau đây nghi ngờ điện thoại bị nhiễm mã độc?",[1],["Màn hình chính thay đổi màu sắc.","Tự động cài đặt ứng dụng lạ mà không có sự cho phép của Đồng chí.","Thường xuyên hiện thông báo cập nhật hệ thống.","Các ứng dụng không nhận bản cập nhật."]],["Tại sao không nên sử dụng cùng một mật khẩu cho nhiều tài khoản?",[0],["Nếu một tài khoản bị xâm phạm, các tài khoản khác cũng sẽ bị đe dọa.","Không quan trọng.","Để dễ nhớ hơn.","Để tiết kiệm thời gian."]],["Nếu một ứng dụng không liên quan đến nhắn tin nhưng lại yêu cầu quyền đọc và gửi tin nhắn SMS, điều đó có thể là dấu hiệu của điều gì?",[1],["Ứng dụng cung cấp dịch vụ mới. trên dữ liệu"]],["Cần sử dụng dữ liệu từ hệ thống số để tối ưu hóa kế hoạch tác chiến. Kỹ năng nào cần thiết?",[1],["Giao tiếp và cộng tác","Ra quyết định dựa trên dữ liệu","Tư duy sáng tạo","Khả năng thích nghi"]],["Khi tích hợp hệ thống chỉ huy và kiểm soát (C2) số hóa, bạn cần hiểu tác động của công nghệ lên các đơn vị khác nhau. Kỹ năng nào quan trọng?",[0],["Tư duy hệ thống","Hiểu biết công nghệ","Tư duy phân tích","Quản lý thay đổi"]],["Để nhanh chóng làm quen với hệ thống giám sát an ninh mạng mới trong Bộ Quốc phòng, bạn cần kỹ năng nào?",[1],["Giao tiếp và cộng tác","Khả năng thích nghi","Tư duy sáng tạo","Ra quyết định dựa trên dữ liệu"]],["Khi hệ thống quản lý vũ khí số hóa gặp sự cố, bạn cần phân tích dữ liệu để tìm nguyên nhân. Kỹ năng nào phù hợp?",[0],["Tư duy phân tích","Quản lý thay đổi","Ra quyết định dựa trên dữ liệu","Hiểu biết công nghệ"]],["Khi hệ thống quản lý hậu cần số hóa gặp lỗi, thao tác nào bạn thực hiện đầu tiên để xác định vấn đề?",[1],["áp dụng quy trình mới","Phân tích dữ liệu log hệ thống để tìm nguyên nhân","Tổ chức cuộc họp với các đơn vị liên quan","Cập nhật phần mềm hệ thống"]],["Để triển khai hệ thống chỉ huy và kiểm soát (C2) số hóa, thao tác nào giúp đảm bảo các đơn vị phối hợp hiệu quả?",[1],["Thiết kế giao diện người dùng mới","Tổ chức các buổi đào tạo sử dụng hệ thống","Kiểm tra an ninh mạng của hệ thống","Thu thập dữ liệu từ các chiến dịch trước"]],["Khi tối ưu hóa kế hoạch tác chiến dựa trên dữ liệu từ hệ thống số, bạn sẽ thực hiện thao tác nào?",[3],["Cập nhật phần mềm liên lạc","Thay đổi cấu trúc tổ chức đơn vị","Viết báo cáo chi tiết về hiệu suất hệ thống","Sử dụng công cụ phân tích dữ liệu để đánh giá hiệu quả chiến thuật"]],["Để cải thiện quy trình huấn luyện quân sự bằng công nghệ thực tế ảo (VR), bạn sẽ làm gì?",[2],["đầu tư vào phần cứng mới","hân tích dữ liệu hiệu suất từ hệ thống cũ","Xây dựng mô hình VR mô phỏng tình huống chiến đấu","Tổ chức họp với các đơn vị không liên quan"]],["Khi hệ thống giám sát an ninh mạng mới được triển khai, thao tác nào giúp bạn làm quen nhanh với công cụ?",[0],["Tham gia khóa học trực tuyến về công nghệ mới","Thảo luận với đội ngũ kỹ thuật về tính năng","Viết báo cáo về lợi ích của hệ thống","Kiểm tra toàn bộ dữ liệu cũ"]],["Khi phát hiện vấn đề trong hệ thống quản lý vũ khí số hóa, bạn sẽ làm gì để khắc phục?",[2],["Tổ chức buổi họp báo cáo tình hình","Thay đổi toàn bộ phần cứng hệ thống","Sử dụng phần mềm phân tích để kiểm tra dữ liệu lỗi","Đào tạo lại toàn bộ cán bộ chuyên trách"]],["Để đánh giá hiệu quả của hệ thống AI phân tích tình báo, bạn sẽ thực hiện thao tác nào?",[3],["Thay đổi giao diện hệ thống AI","Viết báo cáo về chi phí triển khai AI","Tổ chức hội thảo về công nghệ AI","So sánh kết quả AI với dữ liệu tình báo truyền thống"]],["Trong quá trình chuyển đổi số, khi gặp sự cố hệ thống đột ngột, bước đầu tiên trong kỹ năng giải quyết vấn đề là gì?",[2],["Ngay lập tức triển khai giải pháp thay thế","Tìm nguyên nhân gốc rễ của sự cố","Ghi nhận và xác định rõ vấn đề","Báo cáo lên lãnh đạo và chờ chỉ đạo"]],["Để giải quyết một vấn đề phức tạp trong chuyển đổi số, kỹ năng nào sau đây quan trọng nhất?",[1],["Sao chép kinh nghiệm từ tổ chức khác","Tư duy phản biện và phân tích dữ liệu","Tránh thay đổi để giữ sự ổn định","Chỉ tập trung vào giải pháp công nghệ"]],["Trong quá trình số hóa dữ liệu, hệ thống bị chậm trễ do khối lượng lớn. Giải pháp nào mang tính giải quyết vấn đề bền vững nhất?",[1],["Mua thêm phần cứng mà không đánh giá nhu cầu thực tế","Tối ưu quy trình, chuẩn hóa dữ liệu và áp dụng công nghệ phù hợp","Chia nhỏ dữ liệu rồi xử lý thủ công","Giảm phạm vi số hóa để tránh quá tải"]],["Trong tư duy giải quyết vấn đề khi chuyển đổi số, câu hỏi nào sau đây giúp tìm được giải pháp tối ưu?",[3],["Làm thế nào để giải quyết nhanh nhất?","Làm thế nào để giảm tối đa chi phí trước mắt?","Có thể tránh thay đổi để không phát sinh rủi ro không?","Giải pháp này có giúp đạt mục tiêu dài hạn không?"]],["Một nhóm dự án đang tranh luận về hai giải pháp công nghệ. Để đưa ra quyết định giải quyết vấn đề, phương pháp phù hợp nhất là:",[1],["Chọn theo ý kiến của trưởng nhóm","Phân tích ưu – nhược điểm, so sánh hiệu quả và chi phí của từng giải pháp","Bỏ phiếu nhanh để tiết kiệm thời gian","Chọn giải pháp phổ biến trên thị trường"]],["Trong kỹ năng giải quyết vấn đề, việc sử dụng công cụ số (như BI, AI, phân tích dữ liệu) mang lại lợi ích chính gì?",[2],["Giúp tránh phải ra quyết định khó khăn","Giúp tự động hóa toàn bộ quá trình giải quyết","Giúp có cơ sở dữ liệu khách quan để phân tích và đưa ra quyết định chính xác hơn","Thay thế hoàn toàn con người trong mọi quyết định"]],["Trong chuyển đổi số, yếu tố nào thường gây ra nhiều vấn đề nhất?",[1],["Thiếu công nghệ hiện đại","Sự chống đối thay đổi từ con người","Thiếu ngân sách","Quản lý dữ liệu quá nhiều"]],["Phương pháp “5 Whys” trong giải quyết vấn đề giúp",[0],["Phân tích nguyên nhân gốc rễ","Xác định nhanh giải pháp thay thế","Giảm thời gian thảo luận","Tìm kiếm cơ hội đổi mới"]],["Một kỹ năng quan trọng khi giải quyết vấn đề trong môi trường chuyển đổi số là",[1],["Chỉ dựa vào kinh nghiệm cá nhân","Khả năng thích nghi và học hỏi nhanh","Tránh mọi thay đổi","Tập trung vào giảm chi phí"]],["Tư duy thiết kế (Design Thinking) trong giải quyết vấn đề tập trung vào",[0],["Nhu cầu và trải nghiệm người dùng","Công nghệ và ngân sách","Tối ưu hóa phần cứng","Giảm bớt quy trình"]],["Trong kỹ năng giải quyết vấn đề, việc “xác định phạm vi vấn đề” giúp",[2],["Tránh phải phân tích dữ liệu","Giảm sự tham gia của nhân sự","Ngăn chặn lan rộng và tập trung nguồn lực","Trì hoãn giải quyết để có thêm thông tin"]],["Một dự án chuyển đổi số bị chậm tiến độ do thiếu sự phối hợp giữa các phòng ban. Giải pháp hiệu quả là",[3],["Ép tiến độ","Cắt giảm một số hạng mục để kịp tiến độ","Tạm dừng dự án","Xác định nút thắt giao tiếp, áp dụng công cụ quản lý dự án số, tăng cường phối hợp"]],["Khi đối mặt với sự cố bảo mật, yếu tố ưu tiên số một trong giải quyết vấn đề là",[3],["Tìm ra kẻ tấn công","Báo cáo lên cấp trên","Cô lập toàn bộ hệ thống","Đảm bảo an toàn hệ thống và giảm thiểu thiệt hại ngay lập tức"]],["Để giải quyết vấn đề do dữ liệu không đồng bộ giữa các hệ thống, bước quan trọng nhất là:",[1],["Xóa dữ liệu cũ và nhập lại","Chuẩn hóa dữ liệu và xây dựng cơ chế tích hợp","Giảm khối lượng dữ liệu thu thập","Giao cho một bộ phận nhập thủ công"]],["bạn áp dụng chatbot AI nhưng người dùng phản ánh trả lời không chính xác. Giải pháp hợp lý nhất là",[0],["Cập nhật dữ liệu huấn luyện, theo dõi phản hồi và cải tiến liên tục","Ngừng dùng chatbot","Chỉ dùng chatbot ngoài giờ hành chính","Giảm số lượng khách hàng sử dụng chatbot"]],["Đơn vị đầu tư nền tảng dữ liệu lớn nhưng không khai thác được hiệu quả. Cách giải quyết bền vững là",[0],["Tìm chuyên gia phân tích dữ liệu, đào tạo nhân sự nội bộ và gắn dữ liệu với mục tiêu","Ngừng thu thập dữ liệu để giảm chi phí","Bán dữ liệu cho đối tác","Đổi nền tảng khác ngay lập tức"]],["Trong quá trình chuyển đổi số trong quốc phòng, bước quan trọng đầu tiên để giải quyết vấn đề phát sinh là gì?",[0],["Xác định rõ bản chất vấn đề và phạm vi ảnh hưởng","Ngay lập tức áp dụng giải pháp công nghệ mới","Chờ cấp trên ra mệnh lệnh","Ngắt toàn bộ hệ thống để tránh rủi ro"]],["Khi hệ thống thông tin chỉ huy gặp sự cố, nguyên tắc ưu tiên hàng đầu trong giải quyết vấn đề là:",[2],["Thay đổi phần mềm ngay lập tức","Giao quyền xử lý cho đơn vị ngoài quân đội","Giữ bí mật, an toàn thông tin và duy trì thông tin liên lạc tối thiểu cần thiết","Dừng toàn bộ hoạt động để khắc phục"]],["Yếu tố nào là rào cản lớn nhất trong giải quyết vấn đề chuyển đổi số trong lĩnh vực quốc phòng?",[1],["Thiếu ngân sách","Tâm lý ngại thay đổi và thiếu phối hợp giữa các lực lượng","Công nghệ chưa đủ tiên tiến","Quá nhiều thiết bị hiện đại"]],["Trong diễn tập phòng thủ mạng, nếu phát hiện tấn công giả lập xâm nhập hệ thống, kỹ năng giải quyết vấn đề ưu tiên là",[0],["Tách mạng bị tấn công, phân tích nguyên nhân và triển khai biện pháp ngăn chặn lan rộng","Tắt toàn bộ hệ thống mạng","Báo cáo và chờ xử lý từ bên ngoài","Xóa log để tránh lộ thông tin"]],["Trong huấn luyện, hệ thống mô phỏng tác chiến bị lỗi khiến binh sĩ không thể luyện tập. Cách giải quyết hiệu quả là",[1],["Dừng toàn bộ buổi huấn luyện","Chuyển sang tình huống mô phỏng dự phòng và báo kỹ thuật xử lý song song","Sử dụng bài tập lý thuyết thay thế hoàn toàn","Bỏ qua lỗi và tiếp tục luyện tập"]],["Khi nhiều đơn vị quân đội sử dụng hệ thống quản lý khác nhau dẫn đến khó chia sẻ dữ liệu, giải pháp phù hợp là:",[3],["Giữ nguyên hiện trạng","Chỉ chọn một đơn vị để sử dụng hệ thống số hóa","Chuyển toàn bộ dữ liệu sang giấy tờ","Chuẩn hóa dữ liệu và thiết kế cơ chế tích hợp tập trung"]],["Khi áp dụng công nghệ điện toán đám mây trong quân sự, lo ngại lớn nhất cần giải quyết là",[2],["Tốc độ xử lý","Chi phí đầu tư","An toàn, bảo mật và chủ quyền dữ liệu","Khó khăn trong vận hành"]],["Một đơn vị gặp sự cố mạng diện rộng trong lúc diễn tập. Giải pháp bền vững để xử lý là",[0],["Xây dựng hệ thống dự phòng, diễn tập tình huống và tăng khả năng tự phục hồi của mạng","Giảm quy mô diễn tập","Không dùng mạng số trong diễn tập nữa","Chỉ dùng biện pháp thủ công để thay thế"]],["việc đánh giá rủi ro an ninh mạng trước khi triển khai hệ thống mới giúp",[2],["Tiết kiệm thời gian huấn luyện","Hạn chế lãng phí tài nguyên con người","Chủ động ngăn ngừa sự cố và tăng khả năng sẵn sàng chiến đấu","Giảm chi phí đầu tư công nghệ"]],["Đặc thù khi giải quyết vấn đề chuyển đổi số trong quốc phòng so với doanh nghiệp là",[1],["Ưu tiên tốc độ triển khai","Ưu tiên bí mật, an toàn, tính ổn định và khả năng duy trì tác chiến","Ưu tiên chi phí thấp","Ưu tiên hình thức hiện đại hóa"]],["Một hệ thống thông tin quân sự phải ngừng hoạt động đột ngột. Bước đầu tiên trong giải quyết vấn đề theo chuẩn an toàn quốc phòng là",[0],["Báo cáo cấp chỉ huy, kích hoạt kịch bản ứng phó sự cố và cô lập vùng bị ảnh hưởng","Cài đặt lại phần mềm","Chuyển sang hệ thống dân sự thay thế","Tạm ngưng hoạt động để chờ khắc phục"]],["Storyboard trong sản xuất video là:",[1],["Danh sách nhạc nền sẽ dùng","Bản phác thảo các cảnh quay theo thứ tự","Bảng phân vai chi tiết","Danh mục thiết bị quay"]],["Để nội dung dễ tiếp cận (accessibility), lựa chọn nào phù hợp nhất?",[1],["Chỉ dùng màu tương phản thấp để êm mắt","Bổ sung phụ đề và mô tả âm thanh khi cần","Chữ cỡ thật nhỏ để gọn slide","Dùng font trang trí khó đọc"]],["Khi quản trị trang thông tin đơn vị, cách lên lịch đăng hiệu quả là:",[1],["Đăng ngẫu hứng khi rảnh","Lập lịch bài theo khung giờ phù hợp độc giả","Đăng dồn hết một ngày cho tiện","Chỉ đăng khi có sự cố"]],["Chỉ số nào phản ánh hiệu quả nội dung tốt nhất?",[1],["Màu nền poster","Tỷ lệ tương tác (engagement rate)","Số lần đổi logo","Số trang của bản tin"]],["Trong khủng hoảng thông tin, thông điệp nên:",[1],["Trì hoãn phản hồi nhiều ngày","Ngắn gọn, nhất quán, theo phát ngôn chính thức","Trả lời bằng ảnh chế cho nhẹ nhàng","Bỏ qua mọi bình luận"]],["Để bảo đảm thống nhất nhận diện, cần:",[2],["Thay logo theo từng sự kiện","Màu sắc tùy sở thích người thiết kế","Dùng bộ nhận diện và mẫu chuẩn của đơn vị","Font chữ ngẫu nhiên"]],["Khi ghi âm phỏng vấn ngoài trời, mẹo kỹ thuật hữu ích là:",[2],["Không cần micro rời","Bật nhạc nền thật to","Dùng micro có chắn gió hoặc chọn chỗ tránh gió","Đứng thật xa người nói"]],["Nội dung dài, khó đọc nên chuyển thành định dạng nào để dễ hiểu hơn?",[2],["Văn bản liên tục không hình ảnh","File nén zip","Infographic/ảnh tóm tắt ý chính","Ảnh độ phân giải thấp"]],["Viết tiêu đề hiệu quả cho bài tuyên truyền:",[2],["Dùng 1 chữ chung chung","Viết toàn bộ bằng chữ hoa","Rõ lợi ích/điểm chính, khoảng dưới 60 ký tự","Dùng ký tự đặc biệt gây chú ý"]],["Phóng sự về hoạt động dân vận nên nhấn mạnh:",[2],["Thông tin nội bộ nhạy cảm","Câu view bằng giật tít","Tác động tích cực tới người dân và hình ảnh bộ đội","Yếu tố hài hước quá đà"]],["Quản lý bình luận trên kênh chính thức nên:",[2],["Xóa hết bình luận trái chiều","Tranh luận gay gắt v ,["Khi sử dụng AI để hỗ trợ giao tiếp, cần lưu ý gì?",[1],["Tin hoàn toàn vào AI","Kết hợp với phán đoán con người","Không cần kiểm tra lại nội dung","Chỉ dùng trong giải trí"]],["Khái niệm đúng về dịch vụ công trực tuyến là gì?",[1],["Dịch vụ công trực tuyến là dịch vụ hành chính công và các dịch vụ khác của cơ quan nhà nước được cung cấp cho các tổ chức, cá nhân.","Dịch vụ công trực tuyến là dịch vụ hành chính công và các dịch vụ khác của cơ quan nhà nước được cung cấp cho các tổ chức, cá nhân trên môi trường mạng.","Dịch vụ công trực tuyến là dịch vụ hành chính công của cơ quan nhà nước được cung cấp cho các tổ chức trên môi trường mạng.","Dịch vụ công trực tuyến là dịch vụ hành chính công của cơ quan nhà nước được cung cấp cho các tổ chức, cá nhân trên môi trường mạng."]],["Trong hội nghị trực tuyến của quân đội, mỗi quân nhân phải:",[0],["Sử dụng ngôn ngữ chuẩn mực, tuân thủ kỷ luật phát biểu","Giữ im lặng hoàn toàn","Phát biểu tự do ngoài chủ đề","Gửi biểu tượng cảm xúc liên tục"]],["Phong trào nào góp phần nâng cao kỹ năng số cho mọi người?",[3],["Chính phủ số","Mỗi người một kỹ năng số","Học tập số","Công dân số"]],["Trong giao tiếp số, nguyên tắc bảo mật thông tin là gì?",[1],["Đảm bảo mọi thông tin truyền đi phải được nén để tiết kiệm băng thông","Đảm bảo thông tin chỉ đến được đúng đối tượng có quyền, không bị truy cập trái phép","Đảm bảo tất cả thông tin đều được lưu trữ vĩnh viễn để có thể truy xuất khi cần","Đảm bảo thông tin luôn được hiển thị công khai để tăng tính minh bạch"]],["Giao tiếp trong môi trường số của quân đội phải bảo đảm những nguyên tắc nào?",[0],["Chính xác, kịp thời, bảo mật","Tiện lợi, nhanh chóng, không cần bảo mật","Tuỳ tiện, không cần quy định","Chỉ cần ngắn gọn"]],["Trong môi trường số, kỹ năng lắng nghe hiệu quả được thể hiện qua những yếu tố nào?",[1],["Tắt camera, không chú ý","Chú ý màn hình, phản hồi khi cần","Không cần ghi chú","Luôn tắt micro"]],["Khi tương tác trên các hệ thống có tích hợp AI, quân nhân cần thực hiện những yêu cầu gì?",[1],["Phụ thuộc hoàn toàn vào AI","Kết hợp AI với sự phán đoán, kinh nghiệm","Không kiểm chứng thông tin","Chia sẻ công khai dữ liệu mật"]],["Đặc điểm của giao tiếp số so với trực tiếp là gì?",[0],["Tiện lợi, nhanh chóng, có thể tích hợp AI","Ít chính xác hơn","Không bao giờ chính xác","Không an toàn"]],["Một kỹ năng quan trọng khi thuyết trình trực tuyến là gì?",[0],["Sử dụng ngôn từ chuẩn mực, kết hợp slide, giữ ổn định kết nối mạng","Chỉ nói ngắn gọn, không chuẩn bị","Phát biểu tuỳ tiện, không slide","Để AI nói thay"]],["Vì sao quân nhân cần lựa chọn đúng kênh giao tiếp trong môi trường số?",[0],["Để tăng hiệu quả, đúng đối tượng, đảm bảo bảo mật","Để tiện lợi cho cá nhân","Để tránh trách nhiệm","Để tiết kiệm chi phí điện thoại"]],["Nguyên tắc quan trọng khi chia sẻ dữ liệu công vụ qua mạng là gì?",[2],["Chia sẻ công khai trên mạng xã hội","Chỉ chia sẻ qua USB","Phân quyền truy cập và mã hóa dữ liệu","In ra giấy để phát"]],["Công cụ nào giúp kiểm soát quyền truy cập tài liệu số?",[1],["Phần mềm nén dữ liệu (Winrar, 7zip)","Hệ thống IAM (Identity and Access Management)","Trình duyệt web (Chrome, Firefox)","Công cụ chỉnh sửa văn bản (MS Word, LibreOffice Writer)"]],["Khi gửi tài liệu mật qua môi trường số, cần:",[1],["Sử dụng email cá nhân","Sử dụng hệ thống mã hóa và email công vụ","Dùng mạng xã hội","Dùng USB cá nhân"]],["Một cách an toàn để chia sẻ tài liệu trong quân đội là:",[1],["Dùng cloud công cộng miễn phí","Dùng hệ thống chia sẻ nội bộ có phân quyền","Dùng Facebook group","Dùng Zalo cá nhân"]],["Khi quản lý quyền truy cập dữ liệu, cần chú ý gì?",[0],["Chỉ cấp quyền cho đúng người, đúng mục đích","Cấp quyền đại trà cho tất cả mọi người","Không cần phân quyền","Công khai toàn bộ dữ liệu"]],["Chia sẻ dữ liệu trên blockchain có ưu điểm gì?",[0],["Tính minh bạch, khó bị giả mạo","Không cần kiểm soát","Chia sẻ nhanh nhưng không an toàn","Chỉ dùng trong game"]],["Sai lầm thường gặp khi chia sẻ dữ liệu là gì?",[0],["Không phân loại mức độ mật của
